  <style>

  <script type="text/babel">
    /* ==========================================================
       프로그램명: 전사 연차·대체휴무 통합 관리 시스템
       버전: v2.48 (모바일 반응형 레이아웃 및 폼 최적화 적용)
       작성자: 삼식이(제미나이) & 거북형님
       ========================================================== */

    const firebaseConfig = {
      apiKey: "AIzaSyAqIgwEY1WitvuleJOyGW5ZHVSEv4f2PuM",
      authDomain: "intpto-4f9d0.firebaseapp.com",
      projectId: "intpto-4f9d0",
      storageBucket: "intpto-4f9d0.firebasestorage.app",
      messagingSenderId: "1051328398066",
      appId: "1:1051328398066:web:818ab5420236dc2bc8466b",
      measurementId: "G-PSHXN6H9SN"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const FIXED_HOLIDAYS = ["01-01", "03-01", "05-05", "06-06", "07-17", "08-15", "10-03", "10-09", "12-25"];
    const LUNAR_HOLIDAYS_MAP = {
      2025: ["01-28", "01-29", "01-30", "05-05", "10-05", "10-06", "10-07"],
      2026: ["02-16", "02-17", "02-18", "05-24", "08-17", "09-24", "09-25", "09-26", "10-05"],
      2027: ["02-06", "02-07", "02-08", "05-13", "09-14", "09-15", "09-16"],
      2028: ["01-26", "01-27", "01-28", "05-02", "10-02", "10-03", "10-04"]
    };

    const TITLE_PRIORITY = { "대표": 1, "이사": 2, "부장": 3, "차장": 4, "과장": 5, "대리": 6, "주임": 7, "사원": 8 };
    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

    function calculateAnnualLeave(hireDateStr, targetYear) {
      if (!hireDateStr) return 15;
      
      const hireDate = new Date(hireDateStr);
      const hireYear = hireDate.getFullYear();

      if (hireYear > targetYear) return 0;

      if (hireYear === targetYear) {
        const yearEnd = new Date(targetYear, 11, 31);
        let monthDiff = (yearEnd.getFullYear() - hireDate.getFullYear()) * 12 + (yearEnd.getMonth() - hireDate.getMonth());
        if (yearEnd.getDate() < hireDate.getDate()) {
          monthDiff--;
        }
        return Math.max(0, Math.min(monthDiff, 11));
      }

      if (targetYear === hireYear + 1) {
        const yearEnd = new Date(hireYear, 11, 31);
        const workedDays = Math.floor((yearEnd - hireDate) / (1000 * 60 * 60 * 24)) + 1;
        const proportionalLeave = (15 * workedDays) / 365;
        return Math.round(proportionalLeave * 10) / 10;
      }

      const yearDiff = targetYear - hireYear;
      if (yearDiff < 4) {
        return 15;
      } else {
        const additionalDays = Math.floor((yearDiff - 2) / 2);
        return Math.min(15 + additionalDays, 25);
      }
    }

    function isHoliday(year, month, day) {
      const mm = String(month).padStart(2, '0');
      const dd = String(day).padStart(2, '0');
      const mmdd = `${mm}-${dd}`;
      if (FIXED_HOLIDAYS.includes(mmdd)) return true;
      if (LUNAR_HOLIDAYS_MAP[year] && LUNAR_HOLIDAYS_MAP[year].includes(mmdd)) return true;
      return false;
    }

    function App() {
      const [currentUser, setCurrentUser] = React.useState(null);
      const [currentTab, setCurrentTab] = React.useState("matrix");
      const [selectedYear, setSelectedYear] = React.useState(new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = React.useState(new Date().getMonth() + 1);
      
      const [employees, setEmployees] = React.useState([]);
      const [requests, setRequests] = React.useState([]);
      const [adminConfig, setAdminConfig] = React.useState({ pin: "1234" });

      const [loginName, setLoginName] = React.useState("");
      const [loginPw, setLoginPw] = React.useState("");
      const [isAdminLoginMode, setIsAdminLoginMode] = React.useState(false);
      const [adminPin, setAdminPin] = React.useState("");

      const [editingEmp, setEditingEmp] = React.useState(null);
      const [editingReq, setEditingReq] = React.useState(null);
      const [showAddReqModal, setShowAddReqModal] = React.useState(false);
      const [showChangePinModal, setShowChangePinModal] = React.useState(false);
      const [visiblePwEmpId, setVisiblePwEmpId] = React.useState(null);

      const [rejectTarget, setRejectTarget] = React.useState(null);
      const [rejectReasonText, setRejectReasonText] = React.useState("");

      const [newHireDate, setNewHireDate] = React.useState("");
      const [newLeaveCount, setNewLeaveCount] = React.useState(15);

      // 사이드바 가로 너비 조절용 State (PC 전용)
      const [sidebarWidth, setSidebarWidth] = React.useState(240);
      const [isResizing, setIsResizing] = React.useState(false);

      const [sortConfig, setSortConfig] = React.useState({ key: 'date', direction: 'desc' });
      
      const [appliedFilters, setAppliedFilters] = React.useState({
        empName: '', category: '', type: '', date: '', reason: '', status: ''
      });
      const [inputFilters, setInputFilters] = React.useState({
        empName: '', category: '', type: '', date: '', reason: '', status: ''
      });

      // 마우스 드래그로 사이드바 너비 조절 이벤트 핸들러
      React.useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isResizing) return;
          const newWidth = e.clientX;
          if (newWidth >= 180 && newWidth <= 450) {
            setSidebarWidth(newWidth);
          }
        };

        const handleMouseUp = () => {
          setIsResizing(false);
        };

        if (isResizing) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isResizing]);

      React.useEffect(() => {
        const unsubEmp = db.collection("employees").onSnapshot(snapshot => {
          const empList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          empList.sort((a, b) => {
            const pA = TITLE_PRIORITY[a.title] || 99;
            const pB = TITLE_PRIORITY[b.title] || 99;
            if (pA !== pB) return pA - pB;

            const numA = parseInt((a.empNo || "").replace(/[^0-9]/g, "")) || 0;
            const numB = parseInt((b.empNo || "").replace(/[^0-9]/g, "")) || 0;
            if (numA !== numB) return numA - numB;

            return (a.empNo || "").localeCompare(b.empNo || "");
          });

          setEmployees(empList);
        });
        const unsubReq = db.collection("requests").onSnapshot(snapshot => {
          const reqList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          reqList.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          setRequests(reqList);
        });
        const unsubConfig = db.collection("settings").doc("adminConfig").onSnapshot(doc => {
          if (doc.exists) {
            setAdminConfig(doc.data());
          } else {
            db.collection("settings").doc("adminConfig").set({ pin: "1234" });
          }
        });
        return () => { unsubEmp(); unsubReq(); unsubConfig(); };
      }, []);

      // 연차 사용 일수 (특정 년-월 말일 기준까지의 총 사용량)
      const getUsedLeaveCountUntilMonth = (fullName, year, month) => {
        const targetCutoff = `${year}-${String(month).padStart(2, '0')}-31`;
        return requests
          .filter(r => r.empName === fullName && r.status === "승인" && r.category === "연차" && (r.date || "") <= targetCutoff)
          .reduce((acc, cur) => {
            const t = cur.type || "";
            if (t.includes("(0)") || t.includes("야근") || t === "가족돌봄휴가" || t === "가족장례휴가") {
              return acc;
            }
            return acc + (parseFloat(cur.usedDays) || 0);
          }, 0);
      };

      // 전체 기간 누적 연차 사용 일수
      const getUsedLeaveCountTotal = (fullName) => {
        return requests
          .filter(r => r.empName === fullName && r.status === "승인" && r.category === "연차")
          .reduce((acc, cur) => {
            const t = cur.type || "";
            if (t.includes("(0)") || t.includes("야근") || t === "가족돌봄휴가" || t === "가족장례휴가") {
              return acc;
            }
            return acc + (parseFloat(cur.usedDays) || 0);
          }, 0);
      };

      // 대체휴무 요약 계산 함수 (전체 누적 / 특정월말 기준)
      const getCompSummary = (emp, targetYear = null, targetMonth = null) => {
        const fullName = `${emp.title || ''} ${emp.name}`.trim();
        const compCarry = parseFloat(emp.compCarryOver || 0);

        let filteredReqs = requests.filter(r => r.empName === fullName && r.status === "승인");
        if (targetYear && targetMonth) {
          const targetCutoff = `${targetYear}-${String(targetMonth).padStart(2, '0')}-31`;
          filteredReqs = filteredReqs.filter(r => (r.date || "") <= targetCutoff);
        }

        const totalGen = filteredReqs
          .filter(r => r.type === "대체휴무발생")
          .reduce((acc, cur) => acc + (parseFloat(cur.usedDays) || 1), 0);

        const totalUse = filteredReqs
          .filter(r => r.type === "대체휴무사용")
          .reduce((acc, cur) => acc + (parseFloat(cur.usedDays) || 1), 0);

        const totalGenIncludeCarry = compCarry + totalGen;
        const remain = totalGenIncludeCarry - totalUse;

        return { compCarry, totalGen, totalGenIncludeCarry, totalUse, remain };
      };

      const handleEmployeeLogin = (e) => {
        e.preventDefault();
        const emp = employees.find(item => `${item.title || ''} ${item.name}`.trim() === loginName || item.name === loginName || item.empNo === loginName);
        
        if (!emp) {
          alert("등록되지 않은 직원입니다. 관리자에게 문의하세요.");
          return;
        }

        if (!emp.password) {
          if (!loginPw) {
            alert("최초 로그인입니다. 사용할 비밀번호를 입력해주세요.");
            return;
          }
          db.collection("employees").doc(emp.id).update({ password: loginPw });
          alert("비밀번호가 설정되었습니다. 정상 로그인됩니다.");
          setCurrentUser({ ...emp, password: loginPw });
        } else {
          if (emp.password !== loginPw) {
            alert("비밀번호가 일치하지 않습니다.");
            return;
          }
          setCurrentUser(emp);
        }
        setCurrentTab("matrix");
        setLoginName("");
        setLoginPw("");
      };

      const handleAdminPinLogin = (e) => {
        e.preventDefault();
        const currentPin = adminConfig.pin || "1234";
        if (adminPin === currentPin) {
          setCurrentUser({ id: "admin", name: "최고관리자", role: "admin", title: "관리자" });
          setCurrentTab("matrix");
          setAdminPin("");
        } else {
          alert("관리자 비밀번호가 올바르지 않습니다.");
        }
      };

      const handleChangeAdminPin = async (e) => {
        e.preventDefault();
        const newPin = e.target.newPin.value;
        const confirmPin = e.target.confirmPin.value;

        if (newPin !== confirmPin) {
          alert("새 비밀번호가 일치하지 않습니다.");
          return;
        }

        try {
          await db.collection("settings").doc("adminConfig").set({ pin: newPin });
          alert("관리자 비밀번호가 성공적으로 변경되었습니다.");
          setShowChangePinModal(false);
        } catch (err) {
          alert("변경 중 오류가 발생했습니다: " + err.message);
        }
      };

      const handleHireDateChange = (e) => {
        const dateVal = e.target.value;
        setNewHireDate(dateVal);
        if (dateVal) {
          const autoCalculated = calculateAnnualLeave(dateVal, selectedYear);
          setNewLeaveCount(autoCalculated);
        }
      };

      const handleAddEmployee = (e) => {
        e.preventDefault();
        const empNo = e.target.empNo.value.trim();
        const title = e.target.title.value.trim();
        const name = e.target.empName.value.trim();
        const hireDate = newHireDate;
        const leaveCount = parseFloat(newLeaveCount);

        const wsData = [];

          const baseLeave = emp.hireDate ? calculateAnnualLeave(emp.hireDate, selectedYear) : (emp.leaveCount || 15);
          const totalLeave = baseLeave + (emp.carryOver || 0) + (emp.extraLeave || 0);
          const usedLeaveMonth = getUsedLeaveCountUntilMonth(fullName, selectedYear, selectedMonth);
          const remainLeaveMonth = totalLeave - usedLeaveMonth;
          
          const compSumMonth = getCompSummary(emp, selectedYear, selectedMonth);

          const leaveRow = [emp.empNo || '-', fullName, "연차/휴무"];
          const compRow = [emp.empNo || '-', fullName, "대휴발생및사용"];

          for (let d = 1; d <= 31; d++) {
            if (d <= daysInMonth) {
              const type = daysData[d];

              } else {
                matrixSheet[cellRef].s = headerBaseStyle;
              }
            } else {
              const val = matrixSheet[cellRef].v;
              if (C === 2) {
                matrixSheet[cellRef].s = (R % 2 === 0) ? leaveCategoryStyle : compCategoryStyle;
              } else if (val === 1 || val === 0.5 || val === 0.25) {
                matrixSheet[cellRef].s = leaveValStyle;
              } else if (val === "+1" && C !== 2) {

        const fileName = isAdmin
          ? `전사_연차대휴관리대장_${selectedYear}년_${selectedMonth}월.xlsx`
          : `${currentUser.name}_연차대휴내역_${selectedYear}년_${selectedMonth}월.xlsx`;

        XLSX.writeFile(workbook, fileName);
      };

      const renderDaysHeader = () => {
        const daysInMonth = new Date(selectedYear, selectedMonth, 0).getDate();
        const days = [];

        for (let d = 1; d <= 31; d++) {
          if (d <= daysInMonth) {
            const currentDate = new Date(selectedYear, selectedMonth - 1, d);
            const dayOfWeek = currentDate.getDay();
            const holi = isHoliday(selectedYear, selectedMonth, d);
            let dayClass = "";
            if (dayOfWeek === 6) dayClass = "sat";
            if (dayOfWeek === 0 || holi) dayClass = "sun";

            days.push(
              <th key={d} className={dayClass} style={{ width: '28px' }}>
                <div>{d}</div>
                <div style={{ fontSize: '10px' }}>{WEEKDAYS[dayOfWeek]}</div>
              </th>
            );
          } else {
            days.push(<th key={d} style={{ background: '#eee', width: '28px' }}>-</th>);
          }
        }
        return days;
      };

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });
      };

      const handleInputChange = (key, value) => {
        setInputFilters(prev => ({ ...prev, [key]: value }));
      };

      const handleApplySearch = (e) => {
        if (e) e.preventDefault();
        setAppliedFilters({ ...inputFilters });
      };

      const handleResetSearch = () => {
        const empty = { empName: '', category: '', type: '', date: '', reason: '', status: '' };
        setInputFilters(empty);
        setAppliedFilters(empty);
        setSortConfig({ key: 'date', direction: 'desc' });
      };

      const getProcessedRequests = () => {
        let result = [...requests];

        if (appliedFilters.empName) {
          result = result.filter(r => (r.empName || '').toLowerCase().includes(appliedFilters.empName.toLowerCase()));
        }
        if (appliedFilters.category) {
          result = result.filter(r => (r.category || '연차') === appliedFilters.category);
        }
        if (appliedFilters.type) {
          result = result.filter(r => r.type === appliedFilters.type);
        }
        if (appliedFilters.date) {
          result = result.filter(r => (r.date || '').includes(appliedFilters.date));
        }
        if (appliedFilters.reason) {
          result = result.filter(r => (r.reason || '').toLowerCase().includes(appliedFilters.reason.toLowerCase()));
        }
        if (appliedFilters.status) {
          result = result.filter(r => (r.status || '대기') === appliedFilters.status);
        }

        if (sortConfig.key) {
          result.sort((a, b) => {
            let valA = a[sortConfig.key] || '';
            let valB = b[sortConfig.key] || '';

            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();

            if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
            if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }

        return result;
      };

      if (!currentUser) {
        return (
          <div className="login-box">
            <h2 style={{ textAlign: 'center', marginBottom: '5px' }}>근태 관리 시스템</h2>
            <p style={{ textAlign: 'center', color: '#666', fontSize: '12px', marginBottom: '20px' }}>MADE BY 삼식이(제미나이) - v2.48</p>
            
            {!isAdminLoginMode ? (
              <form onSubmit={handleEmployeeLogin}>
                <div className="form-group">
                  <label>직원 이름 또는 사원번호</label>
                  <input type="text" placeholder="예: 박성우 또는 사원번호 입력" value={loginName} onChange={(e) => setLoginName(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>비밀번호 (최초 로그인 시 사용할 비밀번호 입력)</label>
                  <input type="password" placeholder="비밀번호" value={loginPw} onChange={(e) => setLoginPw(e.target.value)} required />
                </div>
                <button className="btn" style={{ width: '100%', padding: '10px', marginBottom: '10px' }} type="submit">직원 로그인</button>
                <button type="button" className="btn btn-danger" style={{ width: '100%', padding: '10px', background: '#7f8c8d' }} onClick={() => setIsAdminLoginMode(true)}>
                  관리자 로그인으로 전환
                </button>
              </form>
            ) : (
              <form onSubmit={handleAdminPinLogin}>
                <div className="form-group">
                  <label>관리자 비밀번호</label>
                  <input type="password" placeholder="비밀번호 (기본: 1234)" value={adminPin} onChange={(e) => setAdminPin(e.target.value)} required />
                </div>
                <button className="btn btn-danger" style={{ width: '100%', padding: '10px', marginBottom: '10px' }} type="submit">관리자 로그인</button>
                <button type="button" className="btn" style={{ width: '100%', padding: '10px', background: '#7f8c8d' }} onClick={() => setIsAdminLoginMode(false)}>
                  직원 로그인으로 전환
                </button>
              </form>
            )}
          </div>
        );
      }

      const isAdmin = currentUser.role === 'admin' || currentUser.id === 'admin';
      const displayEmployees = isAdmin ? employees : employees.filter(e => e.id === currentUser.id);

      return (
        <div className="app-layout">
          <div className="sidebar" style={{ width: `${sidebarWidth}px` }}>
            {/* 사이드바 우측 경계선 드래그 바 */}
            <div 
              className={`sidebar-resizer ${isResizing ? 'resizing' : ''}`}
              onMouseDown={() => setIsResizing(true)}
              title="마우스로 드래그하여 메뉴 너비 조절"
            ></div>

            <div>
              <div className="sidebar-brand">
                <span>📅 근태관리 v2.48</span>
              </div>
              <div className="sidebar-user">
                <div><b>{currentUser.title || ''} {currentUser.name}</b></div>
                <div style={{ color: '#bdc3c7', fontSize: '11px', marginTop: '3px' }}>
                  {isAdmin ? '🛡️ 관리자 권한' : '👤 일반 직원'}
                </div>
              </div>
              <div className="nav-menu">
                <button className={`nav-btn ${currentTab === 'matrix' ? 'active' : ''}`} onClick={() => setCurrentTab('matrix')}>
                  📊 월별 매트릭스
                </button>
                <button className={`nav-btn ${currentTab === 'request' ? 'active' : ''}`} onClick={() => setCurrentTab('request')}>
                  📌 연차 신청
                </button>
                <button className={`nav-btn ${currentTab === 'comp' ? 'active' : ''}`} onClick={() => setCurrentTab('comp')}>
                  🔄 대체휴무 신청
                </button>
                {isAdmin && (
                  <>
                    <button className={`nav-btn ${currentTab === 'emp' ? 'active' : ''}`} onClick={() => setCurrentTab('emp')}>
                      👥 직원/권한/비번관리
                    </button>
                    <button className="nav-btn" style={{ color: '#f39c12' }} onClick={() => setShowChangePinModal(true)}>
                      🔐 관리자 비번변경
                    </button>
                  </>
                )}
              </div>
            </div>
            <div className="sidebar-footer">
              <button className="nav-btn" style={{ background: '#e74c3c', color: '#fff', justifyContent: 'center' }} onClick={() => setCurrentUser(null)}>
                🚪 로그아웃
              </button>
            </div>
          </div>

          <div className="main-content">
            <div className="card">
              {currentTab === 'matrix' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px', flexWrap: 'wrap', gap: '10px' }}>
                    <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
                      <h3 style={{ margin: 0, fontSize: '16px' }}>📊 {selectedYear}년 {selectedMonth}월 연차 및 대체휴무 현황</h3>
                      <select value={selectedYear} onChange={(e) => setSelectedYear(parseInt(e.target.value))}>
                        {[2024, 2025, 2026, 2027, 2028].map(y => <option key={y} value={y}>{y}년</option>)}
                      </select>
                      <select value={selectedMonth} onChange={(e) => setSelectedMonth(parseInt(e.target.value))}>
                        {Array.from({ length: 12 }, (_, i) => i + 1).map(m => <option key={m} value={m}>{m}월</option>)}
                      </select>
                    </div>
                    <button className="btn btn-excel" onClick={exportToExcel} style={{ marginBottom: 0 }}>
                      📥 엑셀 내보내기
                    </button>
                  </div>

                  <div className="matrix-container">
                    <table className="matrix-table">
                      <thead>
                        <tr>
                          <th style={{ width: '65px' }}>사원번호</th>
                          <th style={{ width: '85px' }}>직원명</th>
                          <th style={{ width: '80px' }}>구분</th>
                          {renderDaysHeader()}
                          <th style={{ width: '50px' }}>잔여</th>
                        </tr>
                      </thead>
                      <tbody>
                        {displayEmployees.map(emp => {
                          const fullName = `${emp.title || ''} ${emp.name}`.trim();
                          const daysData = {};
                          requests.filter(r => r.empName === fullName && r.status === "승인").forEach(r => {
                            const [y, m, d] = r.date.split('-').map(Number);
                            if (y === selectedYear && m === selectedMonth) {
                              daysData[d] = r.type;
                            }
                          });

                          const calculatedBaseLeave = emp.hireDate ? calculateAnnualLeave(emp.hireDate, selectedYear) : (emp.leaveCount || 15);
                          const totalLeave = calculatedBaseLeave + (emp.carryOver || 0) + (emp.extraLeave || 0);
                          
                          const usedLeaveMonth = getUsedLeaveCountUntilMonth(fullName, selectedYear, selectedMonth);
                          const remainLeaveMonth = totalLeave - usedLeaveMonth;
                          const compSumMonth = getCompSummary(emp, selectedYear, selectedMonth);

                          return (
                            <React.Fragment key={emp.id}>
                              <tr>
                                <td rowSpan="2" style={{ background: '#f8fafc', fontSize: '11px' }}>{emp.empNo || '-'}</td>
                                <td rowSpan="2" style={{ fontWeight: 'bold', background: '#fafafa' }}>{fullName}</td>
                                <td style={{ background: '#e8f5e9', fontSize: '11px' }}>연차/휴무</td>
                                {Array.from({ length: 31 }, (_, i) => i + 1).map(d => {
                                  const type = daysData[d];
                                  let cellStyle = "";
                                  let valText = "";
                                  if (type === "연차") { valText = "1"; cellStyle = "val-leave"; }
                                  else if (type === "반차") { valText = "0.5"; cellStyle = "val-leave"; }
                                  else if (type === "반반차") { valText = "0.25"; cellStyle = "val-leave"; }
                                  return <td key={d} className={cellStyle}>{valText}</td>;
                                })}
                                <td style={{ fontWeight: 'bold', color: '#27ae60' }}>{remainLeaveMonth}일</td>
                              </tr>
                              <tr>
                                <td style={{ background: '#fff9c4', fontSize: '11px' }}>대휴발생및사용</td>
                                {Array.from({ length: 31 }, (_, i) => i + 1).map(d => {
                                  const type = daysData[d];
                                  let label = "";
                                  let cellStyle = "";
                                  if (type === "대체휴무발생") { label = "+1"; cellStyle = "val-gen"; }
                                  else if (type === "대체휴무사용") { label = "-1"; cellStyle = "val-use"; }
                                  return <td key={d} className={cellStyle}>{label}</td>;
                                })}
                                <td style={{ fontWeight: 'bold', color: '#d35400' }}>{compSumMonth.remain}일</td>
                              </tr>
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {currentTab === 'request' && (() => {
                const myFullName = `${currentUser.title || ''} ${currentUser.name}`.trim();
                const myBase = currentUser.hireDate ? calculateAnnualLeave(currentUser.hireDate, selectedYear) : (currentUser.leaveCount || 15);
                const myCarry = currentUser.carryOver || 0;
                const myExtra = currentUser.extraLeave || 0;
                const myTotal = myBase + myCarry + myExtra;
                const myUsed = getUsedLeaveCountTotal(myFullName);
                const myRemain = myTotal - myUsed;

                return (
                  <div>
                    <h3>📌 연차 신청 및 결재 내역</h3>
                    {!isAdmin && (
                      <div style={{ background: '#e8f4fd', padding: '10px 12px', borderRadius: '6px', marginBottom: '15px', fontSize: '12px', lineHeight: '1.6' }}>
                        <strong>💡 내 {selectedYear}년 연차 현황:</strong><br />
                        기본연차: <b>{myBase}일</b> | 이월: <b>{myCarry}일</b> | 추가: <b>{myExtra}일</b> | 총 연차: <b>{myTotal}일</b><br />
                        실제 사용: <b>{myUsed}일</b> | <b>잔여 연차: <span style={{ color: '#27ae60' }}>{myRemain}일</span></b>
                      </div>
                    )}

                    {/* 반응형 폼 클래스 적용 (req-form-grid) */}
                    <form onSubmit={handleAddAnnualRequest} className="req-form-grid">
                      <select name="type" required>
                        <option value="연차">연차 (1일 차감)</option>
                        <option value="반차">반차 (0.5일 차감)</option>
                        <option value="반반차">반반차 (0.25일 차감)</option>
                        <option value="연차(0)">연차(0) (0일 - 차감없음)</option>
                        <option value="반차(0)">반차(0) (0일 - 차감없음)</option>
                        <option value="반반차(0)">반반차(0) (0일 - 차감없음)</option>
                        <option value="가족돌봄휴가">가족돌봄휴가 (0일 - 차감없음)</option>
                        <option value="가족장례휴가">가족장례휴가 (0일 - 차감없음)</option>
                      </select>
                      <input type="date" name="date" max="9999-12-31" required />
                      <input type="text" name="reason" placeholder="신청 사유 입력" required />
                      <button className="btn" type="submit">휴가 신청하기</button>
                    </form>

                    <h4>{isAdmin ? "전체 연차 신청 내역" : "나의 연차 신청 내역"}</h4>
                    <div className="table-responsive">
                      <table>
                        <thead>
                          <tr>
                            <th>신청자</th>
                            <th>구분</th>
                            <th>차감일수</th>
                            <th>날짜</th>
                            <th>사유</th>
                            <th>상태</th>
                            {isAdmin && <th>결재 관리</th>}
                          </tr>
                        </thead>
                        <tbody>
                          {requests
                            .filter(req => req.category === "연차" && (isAdmin || req.empId === currentUser.id))
                            .map(req => (
                              <tr key={req.id}>
                                <td>{req.empName}</td>
                                <td><b>{req.type}</b></td>
                                <td>{req.usedDays}일</td>
                                <td>{req.date}</td>
                                <td>{req.reason}</td>
                                <td>
                                  <span className={`badge ${req.status === '승인' ? 'bg-approved' : req.status === '반려' ? 'bg-rejected' : 'bg-pending'}`}>
                                    {req.status}
                                  </span>
                                  {req.status === '반려' && req.rejectReason && (
                                    <div className="reject-reason">🚨 반려사유: {req.rejectReason}</div>
                                  )}
                                </td>
                                {isAdmin && (
                                  <td>
                                    {req.status === '대기' && (
                                      <>
                                        <button className="btn btn-success" style={{ padding: '3px 8px', fontSize: '12px', marginRight: '5px' }} onClick={() => handleApprove(req)}>승인</button>
                                        <button className="btn btn-danger" style={{ padding: '3px 8px', fontSize: '12px' }} onClick={() => openRejectModal(req)}>반려</button>
                                      </>
                                    )}
                                  </td>
                                )}
                              </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}

              {currentTab === 'comp' && (() => {
                const myCompSum = getCompSummary(currentUser);
                return (
                  <div>
                    <h3>🔄 대체휴무 발생 및 사용 신청</h3>

                    {!isAdmin && (
                      <div style={{ background: '#fff8e1', padding: '10px 12px', borderRadius: '6px', border: '1px solid #ffe082', marginBottom: '20px', fontSize: '12px', lineHeight: '1.6' }}>
                        <strong style={{ color: '#d35400' }}>💡 내 대체휴무 현황:</strong><br />
                        이월: <b>{myCompSum.compCarry}개</b> | 승인 발생: <b>{myCompSum.totalGen}개</b><br />
                        <b>총 발생: <span style={{ color: '#e67e22' }}>{myCompSum.totalGenIncludeCarry}개</span></b> | 
                        <b>총 사용: <span style={{ color: '#2980b9' }}>{myCompSum.totalUse}개</span></b> | 
                        <b>잔여: <span style={{ color: '#27ae60', fontSize: '14px' }}>{myCompSum.remain}개</span></b>
                      </div>
                    )}
                    
                    <div className="comp-form-container" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px', marginBottom: '25px' }}>
                      <div style={{ background: '#fff9c4', padding: '15px', borderRadius: '6px', border: '1px solid #fbc02d' }}>
                        <h4 style={{ margin: '0 0 10px 0', color: '#d35400', fontSize: '14px' }}>1️⃣ 대체휴무 발생 등록 (주말/공휴일 근무)</h4>
                        <form onSubmit={(e) => handleAddCompRequest(e, "발생")}>
                          <div className="form-group">
                            <label>근무일자 (주말/공휴일)</label>
                            <input type="date" name="date" max="9999-12-31" required />
                          </div>
                          <div className="form-group">
                            <label>근무 사유 및 업무내용</label>
                            <input type="text" name="reason" placeholder="예: 비상근무, 현장지원 등" required />
                          </div>
                          <button className="btn" style={{ background: '#e67e22', width: '100%', height: '40px' }} type="submit">대체휴무 발생 승인신청</button>
                        </form>
                      </div>

                      <div style={{ background: '#e3f2fd', padding: '15px', borderRadius: '6px', border: '1px solid #64b5f6' }}>
                        <h4 style={{ margin: '0 0 10px 0', color: '#1976d2', fontSize: '14px' }}>2️⃣ 대체휴무 사용 결재 신청</h4>
                        <form onSubmit={(e) => handleAddCompRequest(e, "사용")}>
                          <div className="form-group">
                            <label>휴무 사용일자</label>
                            <input type="date" name="date" max="9999-12-31" required />
                          </div>
                          <div className="form-group">
                            <label>사용 사유</label>
                            <input type="text" name="reason" placeholder="예: 개인 사유 등" required />
                          </div>
                          <button className="btn" style={{ background: '#2980b9', width: '100%', height: '40px' }} type="submit">대체휴무 사용 결재신청</button>
                        </form>
                      </div>
                    </div>

                    <h4>{isAdmin ? "전체 대체휴무 내역" : "나의 대체휴무 내역"}</h4>
                    <div className="table-responsive">
                      <table>
                        <thead>
                          <tr>
                            <th>신청자</th>
                            <th>구분</th>
                            <th>날짜</th>
                            <th>사유</th>
                            <th>상태</th>
                            {isAdmin && <th>결재 관리</th>}
                          </tr>
                        </thead>
                        <tbody>
                          {requests
                            .filter(req => req.category === "대체휴무" && (isAdmin || req.empId === currentUser.id))
                            .map(req => (
                              <tr key={req.id}>
                                <td>{req.empName}</td>
                                <td style={{ fontWeight: 'bold', color: req.type === '대체휴무발생' ? '#d35400' : '#1976d2' }}>
                                  {req.type === '대체휴무발생' ? '➕ 발생 (+1일)' : '➖ 사용 (-1일)'}
                                </td>
                                <td>{req.date}</td>
                                <td>{req.reason}</td>
                                <td>
                                  <span className={`badge ${req.status === '승인' ? 'bg-approved' : req.status === '반려' ? 'bg-rejected' : 'bg-pending'}`}>
                                    {req.status}
                                  </span>
                                  {req.status === '반려' && req.rejectReason && (
                                    <div className="reject-reason">🚨 반려사유: {req.rejectReason}</div>
                                  )}
                                </td>
                                {isAdmin && (
                                  <td>
                                    {req.status === '대기' && (
                                      <>
                                        <button className="btn btn-success" style={{ padding: '3px 8px', fontSize: '12px', marginRight: '5px' }} onClick={() => handleApprove(req)}>승인</button>
                                        <button className="btn btn-danger" style={{ padding: '3px 8px', fontSize: '12px' }} onClick={() => openRejectModal(req)}>반려</button>
                                      </>
                                    )}
                                  </td>
                                )}
                              </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}

              {currentTab === 'emp' && isAdmin && (
                <div>
                  <h3>👥 회계년도 연차 부여 및 직원 비밀번호 관리</h3>
                  
                  <div style={{ background: '#eef2f7', padding: '15px', borderRadius: '6px', border: '1px solid #cbd5e1', marginBottom: '20px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
                      <h4 style={{ margin: 0, color: '#2c3e50' }}>📁 연차/대체휴무 기록 엑셀(.xlsx) 일괄 등록</h4>
                      <button className="btn" style={{ background: '#27ae60', fontSize: '12px', padding: '5px 12px' }} onClick={downloadExcelSample}>
                        📄 엑셀 등록양식 다운로드 (.xlsx)
                      </button>
                    </div>
                    <p style={{ fontSize: '12px', color: '#666', margin: '8px 0 12px 0' }}>
                      💡 한글 깨짐 걱정 없는 엑셀 파일로 기존 내역을 작성하여 한 번에 업로드할 수 있습니다.
                    </p>
                    <input type="file" accept=".xlsx, .xls" onChange={handleExcelImport} style={{ background: '#fff', padding: '6px 10px', border: '1px solid #ccc', borderRadius: '4px', width: '100%' }} />
                  </div>

                  <p style={{ fontSize: '12px', color: '#666', marginBottom: '15px' }}>💡 안내: 직원 목록 행을 <b>더블클릭</b>하면 비밀번호 변경, 이월연차, 이월대휴, 추가연차, 권한 등을 언제든 수정할 수 있습니다.</p>
                  
                  <form onSubmit={handleAddEmployee} className="emp-form-container">
                    <div className="emp-grid-row1">
                      <div className="form-group">
                        <label>사원번호</label>
                        <input type="text" name="empNo" placeholder="사번 입력" required />
                      </div>
                      <div className="form-group">
                        <label>직함</label>
                        <input type="text" name="title" placeholder="직함 입력" required />
                      </div>
                      <div className="form-group">
                        <label>사원명</label>
                        <input type="text" name="empName" placeholder="성명 입력" required />
                      </div>
                      <div className="form-group">
                        <label>입사일</label>
                        <input type="date" name="hireDate" value={newHireDate} onChange={handleHireDateChange} max="9999-12-31" required />
                      </div>
                    </div>

                    <div className="emp-grid-row2">
                      <div className="form-group">
                        <label>기본연차({selectedYear}년)</label>
                        <input type="number" step="0.25" name="leaveCount" value={newLeaveCount} onChange={(e) => setNewLeaveCount(e.target.value)} required />
                      </div>
                      <div className="form-group">
                        <label>이월연차</label>
                        <input type="number" step="0.25" name="carryOver" defaultValue="0" />
                      </div>
                      <div className="form-group" style={{ background: '#fff3e0', padding: '5px', borderRadius: '4px', border: '1px solid #ffe0b2' }}>
                        <label style={{ color: '#e65100', fontWeight: 'bold' }}>이월대휴</label>
                        <input type="number" step="1" name="compCarryOver" defaultValue="0" />
                      </div>
                      <div className="form-group">
                        <label>추가연차</label>
                        <input type="number" step="0.25" name="extraLeave" defaultValue="0" />
                      </div>
                      <div className="form-group">
                        <label>비고</label>
                        <input type="text" name="remark" placeholder="가족친화 3년 등" />
                      </div>
                      <div className="form-group">
                        <label>권한</label>
                        <select name="role">
                          <option value="employee">일반직원</option>
                          <option value="admin">관리자</option>
                        </select>
                      </div>
                    </div>

                    <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '10px' }}>
                      <button className="btn btn-success" type="submit" style={{ padding: '8px 25px', width: '100%' }}>직원 등록</button>
                    </div>
                  </form>

                  <div className="emp-table-container">
                    <table className="emp-table">
                      <thead>
                        <tr>
                          <th style={{ width: '70px' }}>사원번호</th>
                          <th style={{ width: '55px' }}>직함</th>
                          <th style={{ width: '80px' }}>사원명</th>
                          <th style={{ width: '100px' }}>비밀번호</th>
                          <th style={{ width: '80px' }}>권한</th>
                          <th style={{ width: '100px' }}>입사일</th>
                          <th style={{ width: '80px' }}>기본연차</th>
                          <th style={{ width: '140px' }}>이월연차/대휴</th>
                          <th style={{ width: '75px' }}>잔여연차</th>
                          <th style={{ width: '70px' }}>잔여대휴</th>
                          <th style={{ width: '130px' }}>관리</th>
                        </tr>
                      </thead>
                      <tbody>
                        {employees.map(e => {
                          const fullName = `${e.title || ''} ${e.name}`.trim();
                          const baseLeave = e.hireDate ? calculateAnnualLeave(e.hireDate, selectedYear) : (e.leaveCount || 15);
                          const total = baseLeave + (e.carryOver || 0) + (e.extraLeave || 0);
                          const used = getUsedLeaveCountTotal(fullName);
                          const remain = total - used;
                          const compSum = getCompSummary(e);
                          const isPwVisible = visiblePwEmpId === e.id;

                          return (
                            <tr key={e.id} className="editable-row" onDoubleClick={() => setEditingEmp(e)} title="더블클릭하여 수정">
                              <td>{e.empNo || '-'}</td>
                              <td>{e.title || '-'}</td>
                              <td>{e.name}</td>
                              <td>
                                <span style={{ fontFamily: 'monospace', fontWeight: 'bold' }}>
                                  {e.password ? (isPwVisible ? e.password : '••••••') : <i style={{ color: '#aaa' }}>미설정</i>}
                                </span>
                                {e.password && (
                                  <button 
                                    type="button" 
                                    style={{ border: 'none', background: 'none', cursor: 'pointer', marginLeft: '4px', fontSize: '11px' }}
                                    onClick={(ev) => {
                                      ev.stopPropagation();
                                      setVisiblePwEmpId(isPwVisible ? null : e.id);
                                    }}
                                  >
                                    {isPwVisible ? '🙈' : '👁️'}
                                  </button>
                                )}
                              </td>
                              <td>
                                <span className={`badge ${e.role === 'admin' ? 'bg-pending' : 'bg-approved'}`}>
                                  {e.role === 'admin' ? '관리자' : '일반'}
                                </span>
                              </td>
                              <td>{e.hireDate || '-'}</td>
                              <td style={{ color: '#2980b9', fontWeight: 'bold' }}>{baseLeave}일</td>
                              <td style={{ fontSize: '11px' }}>
                                연차:{e.carryOver || 0} / <b style={{ color: '#e65100' }}>대휴:{e.compCarryOver || 0}</b>
                              </td>
                              <td style={{ fontWeight: 'bold', color: '#27ae60' }}>{remain}일</td>
                              <td style={{ fontWeight: 'bold', color: '#d35400' }}>{compSum.remain}일</td>
                              <td>
                                <div style={{ display: 'flex', gap: '4px', justifyContent: 'center', whiteSpace: 'nowrap' }}>
                                  <button 
                                    className="btn" 
                                    style={{ padding: '4px 8px', fontSize: '11px', background: '#34495e' }}
                                    onClick={(ev) => {
                                      ev.stopPropagation();
                                      setEditingEmp(e);
                                    }}
                                  >
                                    ✏️ 수정
                                  </button>
                                  <button 
                                    className="btn btn-danger" 
                                    style={{ padding: '4px 8px', fontSize: '11px' }}
                                    onClick={(ev) => {
                                      ev.stopPropagation();
                                      handleDeleteEmployee(e);
                                    }}
                                  >
                                    🗑️ 삭제
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  <div style={{ marginTop: '40px', paddingTop: '20px', borderTop: '2px dashed #ccc' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px', flexWrap: 'wrap', gap: '10px' }}>
                      <h3>📜 전사 연차 및 대체휴무 전체 관리자 통합 기록</h3>
                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button 
                          className="btn btn-success" 
                          style={{ fontSize: '12px', padding: '6px 12px' }}
                          onClick={() => setShowAddReqModal(true)}
                        >
                          ➕ 새로운 기록 직접 추가
                        </button>
                        <button 
                          className="btn" 
                          style={{ fontSize: '11px', padding: '4px 10px', background: '#7f8c8d' }}
                          onClick={handleResetSearch}
                        >
                          🔄 검색 조건 초기화
                        </button>
                      </div>
                    </div>
                    <p style={{ fontSize: '12px', color: '#666', marginBottom: '10px' }}>
                      💡 실수로 삭제했거나 누락된 기록은 <b>[➕ 새로운 기록 직접 추가]</b> 버튼을 눌러 언제든 복구/등록할 수 있습니다.
                    </p>

                    <form onSubmit={handleApplySearch} className="filter-box-container">
                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold', display: 'block', marginBottom: '3px' }}>신청자 (직원목록)</label>
                        <select 
                          value={inputFilters.empName} 
                          onChange={(e) => handleInputChange('empName', e.target.value)}
                        >
                          <option value="">전체 직원 선택</option>
                          {employees.map(emp => {
                            const fn = `${emp.title || ''} ${emp.name}`.trim();
                            return <option key={emp.id} value={fn}>{fn}</option>;
                          })}
                        </select>
                      </div>

                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold', display: 'block', marginBottom: '3px' }}>구분 선택</label>
                        <select value={inputFilters.category} onChange={(e) => handleInputChange('category', e.target.value)}>
                          <option value="">전체 (연차/대휴)</option>
                          <option value="연차">연차</option>
                          <option value="대체휴무">대체휴무</option>
                        </select>
                      </div>

                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold', display: 'block', marginBottom: '3px' }}>유형 선택</label>
                        <select value={inputFilters.type} onChange={(e) => handleInputChange('type', e.target.value)}>
                          <option value="">전체 유형</option>
                          <option value="연차">연차 (1일)</option>
                          <option value="반차">반차 (0.5일)</option>
                          <option value="반반차">반반차 (0.25일)</option>
                          <option value="연차(0)">연차(0) (0일)</option>
                          <option value="반차(0)">반차(0) (0일)</option>
                          <option value="반반차(0)">반반차(0) (0일)</option>
                          <option value="가족돌봄휴가">가족돌봄휴가 (0일)</option>
                          <option value="가족장례휴가">가족장례휴가 (0일)</option>
                          <option value="대체휴무발생">대체휴무발생 (+1일)</option>
                          <option value="대체휴무사용">대체휴무사용 (-1일)</option>
                        </select>
                      </div>

                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold', display: 'block', marginBottom: '3px' }}>날짜 타이핑</label>
                        <input 
                          type="text" 
                          placeholder="예: 2026-10" 
                          value={inputFilters.date} 
                          onChange={(e) => handleInputChange('date', e.target.value)} 
                        />
                      </div>

                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold', display: 'block', marginBottom: '3px' }}>사유 타이핑</label>
                        <input 
                          type="text" 
                          placeholder="사유 입력" 
                          value={inputFilters.reason} 
                          onChange={(e) => handleInputChange('reason', e.target.value)} 
                        />
                      </div>

                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold', display: 'block', marginBottom: '3px' }}>상태 선택</label>
                        <select value={inputFilters.status} onChange={(e) => handleInputChange('status', e.target.value)}>
                          <option value="">전체 상태</option>
                          <option value="승인">승인</option>
                          <option value="대기">대기</option>
                          <option value="반려">반려</option>
                        </select>
                      </div>

                      <div>
                        <button type="submit" className="btn btn-success" style={{ width: '100%', padding: '6px', fontSize: '12px' }}>
                          🔍 검색
                        </button>
                      </div>
                    </form>

                    <div className="table-responsive">
                      <table>
                        <thead>
                          <tr>
                            <th className="sortable" onClick={() => handleSort('empName')}>
                              신청자 {sortConfig.key === 'empName' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                            </th>
                            <th className="sortable" onClick={() => handleSort('category')}>
                              구분 {sortConfig.key === 'category' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                            </th>
                            <th className="sortable" onClick={() => handleSort('type')}>
                              일수/유형 {sortConfig.key === 'type' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                            </th>
                            <th className="sortable" onClick={() => handleSort('date')}>
                              날짜 {sortConfig.key === 'date' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                            </th>
                            <th className="sortable" onClick={() => handleSort('reason')}>
                              사유 {sortConfig.key === 'reason' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                            </th>
                            <th className="sortable" onClick={() => handleSort('status')}>
                              상태 {sortConfig.key === 'status' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                            </th>
                            <th>기록 관리</th>
                          </tr>
                        </thead>
                        <tbody>
                          {getProcessedRequests().length === 0 ? (
                            <tr>
                              <td colSpan="7" style={{ padding: '20px', color: '#999' }}>조회된 데이터가 없습니다.</td>
                            </tr>
                          ) : (
                            getProcessedRequests().map(r => (
                              <tr key={r.id}>
                                <td>{r.empName}</td>
                                <td><span className="badge" style={{ background: r.category === '대체휴무' ? '#e67e22' : '#3498db' }}>{r.category || '연차'}</span></td>
                                <td>{r.type} ({r.usedDays}일)</td>
                                <td>{r.date}</td>
                                <td>{r.reason}</td>
                                <td>
                                  <span className={`badge ${r.status === '승인' ? 'bg-approved' : r.status === '반려' ? 'bg-rejected' : 'bg-pending'}`}>
                                    {r.status}
                                  </span>
                                </td>
                                <td>
                                  <div style={{ display: 'flex', gap: '4px', justifyContent: 'center', whiteSpace: 'nowrap' }}>
                                    <button className="btn" style={{ padding: '4px 8px', fontSize: '11px' }} onClick={() => setEditingReq(r)}>✏️ 수정</button>
                                    <button className="btn btn-danger" style={{ padding: '4px 8px', fontSize: '11px' }} onClick={() => handleDeleteRequest(r)}>🗑️ 삭제</button>
                                  </div>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}
              
              <div className="watermark">MADE BY 삼식이(제미나이) - v2.48</div>
            </div>
          </div>

          {showAddReqModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3 style={{ color: '#27ae60' }}>➕ 새로운 휴가/대체휴무 기록 직접 추가</h3>
                <form onSubmit={handleAdminCreateRequest}>
                  <div className="form-group">
                    <label>신청자 (직원선택)</label>
                    <select name="addEmpId" required>
                      <option value="">직원을 선택하세요</option>
                      {employees.map(emp => {
                        const fn = `${emp.title || ''} ${emp.name}`.trim();
                        return <option key={emp.id} value={emp.id}>{fn} ({emp.empNo || '사번없음'})</option>;
                      })}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>유형/구분</label>
                    <select name="addType" required>
                      <option value="연차">연차 (1일 차감)</option>
                      <option value="반차">반차 (0.5일 차감)</option>
                      <option value="반반차">반반차 (0.25일 차감)</option>
                      <option value="연차(0)">연차(0) (0일 차감)</option>
                      <option value="반차(0)">반차(0) (0일 차감)</option>
                      <option value="반반차(0)">반반차(0) (0일 차감)</option>
                      <option value="가족돌봄휴가">가족돌봄휴가 (0일 차감)</option>
                      <option value="가족장례휴가">가족장례휴가 (0일 차감)</option>
                      <option value="대체휴무발생">대체휴무발생 (+1일)</option>
                      <option value="대체휴무사용">대체휴무사용 (-1일)</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>날짜</label>
                    <input type="date" name="addDate" max="9999-12-31" required />
                  </div>
                  <div className="form-group">
                    <label>사유</label>
                    <input type="text" name="addReason" placeholder="예: 누락 기록 복구 등" required />
                  </div>
                  <div className="form-group">
                    <label>승인 상태</label>
                    <select name="addStatus" defaultValue="승인" required>
                      <option value="승인">승인 (즉시 잔여/대휴 반영)</option>
                      <option value="대기">대기</option>
                      <option value="반려">반려</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-success" type="submit" style={{ flex: 1 }}>기록 등록</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1 }} onClick={() => setShowAddReqModal(false)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editingReq && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3>✏️ 신청 기록 수정</h3>
                <form onSubmit={handleUpdateRequest}>
                  <div className="form-group">
                    <label>신청자</label>
                    <input type="text" value={editingReq.empName} disabled style={{ background: '#f0f0f0' }} />
                  </div>
                  <div className="form-group">
                    <label>유형/구분</label>
                    <select name="editType" defaultValue={editingReq.type} required>
                      <option value="연차">연차 (1일 차감)</option>
                      <option value="반차">반차 (0.5일 차감)</option>
                      <option value="반반차">반반차 (0.25일 차감)</option>
                      <option value="연차(0)">연차(0) (0일 차감)</option>
                      <option value="반차(0)">반차(0) (0일 차감)</option>
                      <option value="반반차(0)">반반차(0) (0일 차감)</option>
                      <option value="가족돌봄휴가">가족돌봄휴가 (0일 차감)</option>
                      <option value="가족장례휴가">가족장례휴가 (0일 차감)</option>
                      <option value="대체휴무발생">대체휴무발생 (+1일)</option>
                      <option value="대체휴무사용">대체휴무사용 (-1일)</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>날짜</label>
                    <input type="date" name="editDate" defaultValue={editingReq.date} max="9999-12-31" required />
                  </div>
                  <div className="form-group">
                    <label>사유</label>
                    <input type="text" name="editReason" defaultValue={editingReq.reason} required />
                  </div>
                  <div className="form-group">
                    <label>승인 상태</label>
                    <select name="editStatus" defaultValue={editingReq.status} required>
                      <option value="승인">승인</option>
                      <option value="대기">대기</option>
                      <option value="반려">반려</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-success" type="submit" style={{ flex: 1 }}>수정 완료</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1, background: '#7f8c8d' }} onClick={() => setEditingReq(null)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {rejectTarget && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3 style={{ color: '#e74c3c' }}>🚨 반려 사유 입력</h3>
                <p style={{ fontSize: '13px', color: '#666' }}>신청자에게 보여질 반려 사유를 입력해 주세요.</p>
                <form onSubmit={handleConfirmReject}>
                  <div className="form-group">
                    <label>반려 사유</label>
                    <textarea 
                      rows="3" 
                      value={rejectReasonText} 
                      onChange={(e) => setRejectReasonText(e.target.value)} 
                      placeholder="예: 업무 과중 기간, 사전 협의 필요 등" 
                      required 
                    />
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-danger" type="submit" style={{ flex: 1 }}>반려 확정</button>
                    <button className="btn" type="button" style={{ flex: 1, background: '#7f8c8d' }} onClick={() => setRejectTarget(null)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editingEmp && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3>✏️ 직원 정보 및 이월대휴/비밀번호 수정</h3>
                <form onSubmit={handleUpdateEmployee}>
                  <div className="form-group">
                    <label>사원번호</label>
                    <input type="text" name="editEmpNo" defaultValue={editingEmp.empNo || ''} required />
                  </div>
                  <div className="form-group">
                    <label>직함</label>
                    <input type="text" name="editTitle" defaultValue={editingEmp.title || ''} required />
                  </div>
                  <div className="form-group">
                    <label>사원명</label>
                    <input type="text" name="editName" defaultValue={editingEmp.name || ''} required />
                  </div>
                  <div className="form-group" style={{ background: '#fff9c4', padding: '10px', borderRadius: '4px', border: '1px solid #fbc02d' }}>
                    <label style={{ color: '#d35400', fontWeight: 'bold' }}>🔑 직원 로그인 비밀번호 관리</label>
                    <input 
                      type="text" 
                      name="editPassword" 
                      defaultValue={editingEmp.password || ''} 
                      placeholder="새 비밀번호 직접 입력 (공백 시 재설정 대기)" 
                    />
                    <small style={{ color: '#666', fontSize: '11px' }}>* 비워두면 직원이 다음 로그인 시 직접 비밀번호를 재설정합니다.</small>
                  </div>
                  <div className="form-group">
                    <label>입사일</label>
                    <input type="date" name="editHireDate" max="9999-12-31" defaultValue={editingEmp.hireDate || ''} required />
                  </div>
                  <div className="form-group">
                    <label>기본 연차 일수 (회계년도)</label>
                    <input type="number" step="0.25" name="editLeaveCount" defaultValue={editingEmp.leaveCount || 15} required />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                    <div className="form-group">
                      <label>이월 연차 일수</label>
                      <input type="number" step="0.25" name="editCarryOver" defaultValue={editingEmp.carryOver || 0} />
                    </div>
                    <div className="form-group" style={{ background: '#fff3e0', padding: '5px', borderRadius: '4px', border: '1px solid #ffe0b2' }}>
                      <label style={{ color: '#e65100', fontWeight: 'bold' }}>이월 대휴 일수</label>
                      <input type="number" step="1" name="editCompCarryOver" defaultValue={editingEmp.compCarryOver || 0} />
                    </div>
                  </div>
                  <div className="form-group">
                    <label>추가 연차 일수</label>
                    <input type="number" step="0.25" name="editExtraLeave" defaultValue={editingEmp.extraLeave || 0} />
                  </div>
                  <div className="form-group">
                    <label>비고</label>
                    <input type="text" name="editRemark" defaultValue={editingEmp.remark || ''} placeholder="사유 입력" />
                  </div>
                  <div className="form-group">
                    <label>권한 등급</label>
                    <select name="editRole" defaultValue={editingEmp.role || 'employee'}>
                      <option value="employee">일반직원</option>
                      <option value="admin">관리자</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn" type="submit" style={{ flex: 1 }}>저장하기</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1, onClick: () => setEditingEmp(null) }}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showChangePinModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3>🔐 관리자 비밀번호 변경</h3>
                <form onSubmit={handleChangeAdminPin}>
                  <div className="form-group">
                    <label>새 관리자 비밀번호</label>
                    <input type="password" name="newPin" placeholder="새 비밀번호 입력" required />
                  </div>
                  <div className="form-group">
                    <label>비밀번호 확인</label>
                    <input type="password" name="confirmPin" placeholder="새 비밀번호 재입력" required />
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-success" type="submit" style={{ flex: 1 }}>변경하기</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1, background: '#7f8c8d' }} onClick={() => setShowChangePinModal(false)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
