    const LUNAR_HOLIDAYS_MAP = {
      2025: ["01-28", "01-29", "01-30", "05-05", "10-05", "10-06", "10-07"],

    const TITLE_PRIORITY = { "대표": 1, "이사": 2, "부장": 3, "차장": 4, "과장": 5, "대리": 6, "주임": 7, "사원": 8 };

    function sendTelegramNotification(reqData) {
      if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
      const textMessage = `🚨 [휴가/대휴 신청 대기 알림]\n\n• 신청자: ${reqData.empName}\n• 구분: ${reqData.category} (${reqData.type})\n• 날짜: ${reqData.date}\n• 사유: ${reqData.reason}\n\n시스템에 접속하여 승인/반려 처리를 진행해 주세요.`;
      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: textMessage })
      })
      .then(res => res.json())
      .then(data => console.log("텔레그램 알림 전송 완료:", data))
      .catch(err => console.error("텔레그램 알림 에러:", err));
    }

    function calculateAnnualLeave(hireDateStr, targetYear) {
      if (!hireDateStr) return 15;
      const hireDate = new Date(hireDateStr);
      const hireYear = hireDate.getFullYear();
      if (hireYear > targetYear) return 0;
      if (hireYear === targetYear) {
        const yearEnd = new Date(targetYear, 11, 31);
        let monthDiff = (yearEnd.getFullYear() - hireDate.getFullYear()) * 12 + (yearEnd.getMonth() - hireDate.getMonth());
        if (yearEnd.getDate() < hireDate.getDate()) monthDiff--;
        return Math.max(0, Math.min(monthDiff, 11));
      }
      if (targetYear === hireYear + 1) {
        const yearEnd = new Date(hireYear, 11, 31);
        const workedDays = Math.floor((yearEnd - hireDate) / (1000 * 60 * 60 * 24)) + 1;
        return Math.round(((15 * workedDays) / 365) * 10) / 10;
      }
      const yearDiff = targetYear - hireYear;
      return yearDiff < 4 ? 15 : Math.min(15 + Math.floor((yearDiff - 2) / 2), 25);
    }

    function isHoliday(year, month, day) {
      const mmdd = `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      return FIXED_HOLIDAYS.includes(mmdd) || (LUNAR_HOLIDAYS_MAP[year] && LUNAR_HOLIDAYS_MAP[year].includes(mmdd));
    }

    function App() {
      const [currentUser, setCurrentUser] = React.useState(null);
      const [currentTab, setCurrentTab] = React.useState("matrix");
      const [selectedYear, setSelectedYear] = React.useState(new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = React.useState(new Date().getMonth() + 1);
      
      const [employees, setEmployees] = React.useState([]);
      const [requests, setRequests] = React.useState([]);
      const [adminConfig, setAdminConfig] = React.useState({ pin: "1234" });

      const [loginName, setLoginName] = React.useState("");
      const [loginPw, setLoginPw] = React.useState("");
      const [isAdminLoginMode, setIsAdminLoginMode] = React.useState(false);
      const [adminPin, setAdminPin] = React.useState("");

      const [editingEmp, setEditingEmp] = React.useState(null);
      const [editingReq, setEditingReq] = React.useState(null);
      const [showAddReqModal, setShowAddReqModal] = React.useState(false);
      const [showChangePinModal, setShowChangePinModal] = React.useState(false);
      const [visiblePwEmpId, setVisiblePwEmpId] = React.useState(null);

      const [rejectTarget, setRejectTarget] = React.useState(null);
      const [rejectReasonText, setRejectReasonText] = React.useState("");

      const [newHireDate, setNewHireDate] = React.useState("");
      const [newLeaveCount, setNewLeaveCount] = React.useState(15);

      const [sidebarWidth, setSidebarWidth] = React.useState(240);
      const [isResizing, setIsResizing] = React.useState(false);

      const [sortConfig, setSortConfig] = React.useState({ key: 'date', direction: 'desc' });
      const [empSortConfig, setEmpSortConfig] = React.useState({ key: 'title', direction: 'asc' });
      
      const [appliedFilters, setAppliedFilters] = React.useState({ empName: '', category: '', type: '', date: '', reason: '', status: '' });
      const [inputFilters, setInputFilters] = React.useState({ empName: '', category: '', type: '', date: '', reason: '', status: '' });

      React.useEffect(() => {
        window.history.pushState({ page: "main" }, "");
        const handlePopState = () => {
          if (editingEmp) { setEditingEmp(null); window.history.pushState({ page: "main" }, ""); return; }
          if (editingReq) { setEditingReq(null); window.history.pushState({ page: "main" }, ""); return; }
          if (showAddReqModal) { setShowAddReqModal(false); window.history.pushState({ page: "main" }, ""); return; }
          if (showChangePinModal) { setShowChangePinModal(false); window.history.pushState({ page: "main" }, ""); return; }
          if (rejectTarget) { setRejectTarget(null); window.history.pushState({ page: "main" }, ""); return; }

          if (currentUser) {
            if (currentTab !== "matrix") {
              setCurrentTab("matrix");
              window.history.pushState({ page: "main" }, "");
            } else {
              if (window.confirm("로그아웃 하시겠습니까?")) setCurrentUser(null);
              else window.history.pushState({ page: "main" }, "");
            }
          }
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [editingEmp, editingReq, showAddReqModal, showChangePinModal, rejectTarget, currentUser, currentTab]);

      React.useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isResizing) return;
          const newWidth = e.clientX;
          if (newWidth >= 180 && newWidth <= 450) setSidebarWidth(newWidth);
        };
        const handleMouseUp = () => setIsResizing(false);
        if (isResizing) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isResizing]);

      React.useEffect(() => {
        const unsubEmp = db.collection("employees").onSnapshot(snapshot => {
          const empList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setEmployees(empList);
        });

        let isInitialLoad = true;
        const unsubReq = db.collection("requests").onSnapshot(snapshot => {
          const reqList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          reqList.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

          if (!isInitialLoad) {
            snapshot.docChanges().forEach(change => {
              if (change.type === "added") {
                const newReq = change.doc.data();
                if (newReq.status === "대기") {
                  sendTelegramNotification(newReq);
                }
              }
            });
          }
          isInitialLoad = false;
          setRequests(reqList);
        });

        const unsubConfig = db.collection("settings").doc("adminConfig").onSnapshot(doc => {
          if (doc.exists) setAdminConfig(doc.data());
          else db.collection("settings").doc("adminConfig").set({ pin: "1234" });
        });

        return () => { unsubEmp(); unsubReq(); unsubConfig(); };
      }, []);

      const getSortedEmployees = (list) => {
        const result = [...list];
        result.sort((a, b) => {
          if (empSortConfig.key === 'title') {
            const pA = TITLE_PRIORITY[a.title] || 99;
            const pB = TITLE_PRIORITY[b.title] || 99;
            if (pA !== pB) {
              return empSortConfig.direction === 'asc' ? pA - pB : pB - pA;
            }
            const numA = parseFloat(a.empNo);
            const numB = parseFloat(b.empNo);
            if (!isNaN(numA) && !isNaN(numB)) {
              return empSortConfig.direction === 'asc' ? numA - numB : numB - numA;
            }
            return empSortConfig.direction === 'asc' ? (a.empNo || "").localeCompare(b.empNo || "") : (b.empNo || "").localeCompare(a.empNo || "");
          } else if (empSortConfig.key === 'empNo') {
            const numA = parseFloat(a.empNo);
            const numB = parseFloat(b.empNo);
            if (!isNaN(numA) && !isNaN(numB)) {
              return empSortConfig.direction === 'asc' ? numA - numB : numB - numA;
            }
            const vA = a.empNo || "";
            const vB = b.empNo || "";
            if (vA < vB) return empSortConfig.direction === 'asc' ? -1 : 1;
            if (vA > vB) return empSortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          } else if (empSortConfig.key === 'name') {
            const vA = a.name || "";
            const vB = b.name || "";
            if (vA < vB) return empSortConfig.direction === 'asc' ? -1 : 1;
            if (vA > vB) return empSortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          }
          return 0;
        });
        return result;
      };

      const handleEmpSort = (key) => {
        let direction = 'asc';
        if (empSortConfig.key === key && empSortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setEmpSortConfig({ key, direction });
      };

      const getUsedLeaveCountUntilMonth = (fullName, year, month) => {
        const targetCutoff = `${year}-${String(month).padStart(2, '0')}-31`;
        return requests
          .filter(r => r.empName === fullName && r.status === "승인" && r.category === "연차" && (r.date || "") <= targetCutoff)
          .reduce((acc, cur) => acc + (parseFloat(cur.usedDays) || 0), 0);
      };

      const getUsedLeaveCountTotal = (fullName) => {
        return requests
          .filter(r => r.empName === fullName && r.status === "승인" && r.category === "연차")
          .reduce((acc, cur) => acc + (parseFloat(cur.usedDays) || 0), 0);
      };

      const getCompSummary = (emp, targetYear = null, targetMonth = null) => {
        const fullName = `${emp.title || ''} ${emp.name}`.trim();
        const compCarry = parseFloat(emp.compCarryOver || 0);
        let filteredReqs = requests.filter(r => r.empName === fullName && r.status === "승인");
        if (targetYear && targetMonth) {
          const targetCutoff = `${targetYear}-${String(targetMonth).padStart(2, '0')}-31`;
          filteredReqs = filteredReqs.filter(r => (r.date || "") <= targetCutoff);
        }
        const totalGen = filteredReqs.filter(r => r.type === "대체휴무발생").reduce((acc, cur) => acc + (parseFloat(cur.usedDays) || 1), 0);

          });

          const totalLeave = baseLeave + (emp.carryOver || 0) + (emp.extraLeave || 0);
          const usedLeaveMonth = getUsedLeaveCountUntilMonth(fullName, selectedYear, selectedMonth);

          for (let d = 1; d <= 31; d++) {
            if (d <= daysInMonth) {
              const type = daysData[d];

              else compRow.push("");

          }
          leaveRow.push(`${remainLeaveMonth}일`);
          compRow.push(`${compSumMonth.remain}일`);

          wsData.push(leaveRow);
          wsData.push(compRow);

          merges.push({ s: { r: curRowIdx, c: 0 }, e: { r: curRowIdx + 1, c: 0 } });

        const greenHeaderStyle = { font: { name: "맑은 고딕", sz: 9, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "388E3C" } }, alignment: { horizontal: "center", vertical: "center" } };
        const satHeaderStyle = { font: { name: "맑은 고딕", sz: 9, bold: true, color: { rgb: "2980B9" } }, fill: { fgColor: { rgb: "EBF5FB" } }, alignment: { horizontal: "center", vertical: "center" } };
        const sunHeaderStyle = { font: { name: "맑은 고딕", sz: 9, bold: true, color: { rgb: "C0392B" } }, fill: { fgColor: { rgb: "FADBD8" } }, alignment: { horizontal: "center", vertical: "center" } };
        
        const defaultCellStyle = { font: { name: "맑은 고딕", sz: 9, color: { rgb: "000000" } }, alignment: { horizontal: "center", vertical: "center" } };
        const leaveLabelStyle = { font: { name: "맑은 고딕", sz: 9, color: { rgb: "000000" } }, fill: { fgColor: { rgb: "E8F5E9" } }, alignment: { horizontal: "center", vertical: "center" } };
        const compLabelStyle = { font: { name: "맑은 고딕", sz: 9, color: { rgb: "000000" } }, fill: { fgColor: { rgb: "FFF9C4" } }, alignment: { horizontal: "center", vertical: "center" } };

        const compUseStyle = { font: { name: "맑은 고딕", sz: 9, bold: true, color: { rgb: "1976D2" } }, fill: { fgColor: { rgb: "BBDEFB" } }, alignment: { horizontal: "center", vertical: "center" } };

        const range = XLSX.utils.decode_range(matrixSheet['!ref']);
        for (let R = range.s.r; R <= range.e.r; ++R) {
          for (let C = range.s.c; C <= range.e.c; ++C) {
            const cell_address = XLSX.utils.encode_cell({ r: R, c: C });
            if (!matrixSheet[cell_address]) continue;
            matrixSheet[cell_address].s = { ...defaultCellStyle };
          }
        }

        for (let c = 0; c <= 2; c++) {
          const cell1 = matrixSheet[XLSX.utils.encode_cell({ r: 0, c })];
          const cell2 = matrixSheet[XLSX.utils.encode_cell({ r: 1, c })];
          if (cell1) cell1.s = greenHeaderStyle;
          if (cell2) cell2.s = greenHeaderStyle;
        }
        const cellRemain1 = matrixSheet[XLSX.utils.encode_cell({ r: 0, c: 34 })];
        const cellRemain2 = matrixSheet[XLSX.utils.encode_cell({ r: 1, c: 34 })];
        if (cellRemain1) cellRemain1.s = greenHeaderStyle;
        if (cellRemain2) cellRemain2.s = greenHeaderStyle;

        for (let d = 1; d <= 31; d++) {
          const c = d + 2;
          const cell1 = matrixSheet[XLSX.utils.encode_cell({ r: 0, c })];
          const cell2 = matrixSheet[XLSX.utils.encode_cell({ r: 1, c })];
          if (d <= daysInMonth) {
            const dt = new Date(selectedYear, selectedMonth - 1, d);
            const dayOfWeek = dt.getDay();
            const holi = isHoliday(selectedYear, selectedMonth, d);
            let sStyle = greenHeaderStyle;
            if (dayOfWeek === 6) sStyle = satHeaderStyle;
            if (dayOfWeek === 0 || holi) sStyle = sunHeaderStyle;

            if (cell1) cell1.s = sStyle;
            if (cell2) cell2.s = sStyle;
          } else {

            if (cell2) cell2.s = greenHeaderStyle;

          if (cLeaveLabel) cLeaveLabel.s = leaveLabelStyle;
          if (cCompLabel) cCompLabel.s = compLabelStyle;

          for (let c = 3; c <= 33; c++) {
            const cellLeave = matrixSheet[XLSX.utils.encode_cell({ r: rIdx, c })];

          .filter(r => r.status === "승인" && targetEmpNames.includes(r.empName))

          .forEach(r => {
            detailRows.push([
              r.date || "",
              r.empName || "",
              r.type || r.category || "",
              r.usedDays !== undefined ? r.usedDays : 1,
              r.reason || ""
            ]);
          });

        const detailSheet = XLSX.utils.aoa_to_sheet(detailRows);
        const blueHeaderStyle = { font: { name: "맑은 고딕", sz: 9, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "2980B9" } }, alignment: { horizontal: "center", vertical: "center" } };

        const rangeDetail = XLSX.utils.decode_range(detailSheet['!ref']);
        for (let R = rangeDetail.s.r; R <= rangeDetail.e.r; ++R) {
          for (let C = rangeDetail.s.c; C <= rangeDetail.e.c; ++C) {
            const cell_address = XLSX.utils.encode_cell({ r: R, c: C });
            if (!detailSheet[cell_address]) continue;
            detailSheet[cell_address].s = { font: { name: "맑은 고딕", sz: 9, color: { rgb: "000000" } }, alignment: { horizontal: "center", vertical: "center" } };
          }
        }

        for (let c = 0; c <= 4; c++) {
          const cell = detailSheet[XLSX.utils.encode_cell({ r: 0, c })];
          if (cell) cell.s = blueHeaderStyle;
        }

        const totalDetailRows = detailRows.length;
        detailSheet["!autofilter"] = { ref: `A1:E${Math.max(totalDetailRows, 1)}` };
        detailSheet["!cols"] = [
          { wch: 23.33 },
          { wch: 25.00 },
          { wch: 26.66 },
          { wch: 15.00 },
          { wch: 43.33 }
        ];

        XLSX.utils.book_append_sheet(workbook, detailSheet, "상세사용내역");

        const fileNamePrefix = isAdmin ? "전사" : `${currentUser.name}`;
        XLSX.writeFile(workbook, `${fileNamePrefix}_연차대휴관리대장_${selectedYear}년_${selectedMonth}월.xlsx`);
      };

      const renderDaysHeader = () => {
        const daysInMonth = new Date(selectedYear, selectedMonth, 0).getDate();
        const days = [];
        for (let d = 1; d <= 31; d++) {
          if (d <= daysInMonth) {
            const currentDate = new Date(selectedYear, selectedMonth - 1, d);
            const dayOfWeek = currentDate.getDay();
            const holi = isHoliday(selectedYear, selectedMonth, d);
            let dayClass = "";
            if (dayOfWeek === 6) dayClass = "sat";
            if (dayOfWeek === 0 || holi) dayClass = "sun";

            days.push(
              <th key={d} className={dayClass} style={{ width: '28px' }}>
                <div>{d}</div>
                <div style={{ fontSize: '10px' }}>{WEEKDAYS[dayOfWeek]}</div>
              </th>
            );
          } else { days.push(<th key={d} style={{ background: '#eee', width: '28px' }}>-</th>); }
        }
        return days;
      };

      const handleInputChange = (key, value) => setInputFilters(prev => ({ ...prev, [key]: value }));
      const handleApplySearch = (e) => { if (e) e.preventDefault(); setAppliedFilters({ ...inputFilters }); };

      const getProcessedRequests = () => {
        let result = [...requests];
        if (appliedFilters.empName) result = result.filter(r => (r.empName || '').toLowerCase().includes(appliedFilters.empName.toLowerCase()));
        if (appliedFilters.category) result = result.filter(r => (r.category || '연차') === appliedFilters.category);
        if (appliedFilters.type) result = result.filter(r => r.type === appliedFilters.type);
        if (appliedFilters.date) result = result.filter(r => (r.date || '').includes(appliedFilters.date));
        if (appliedFilters.reason) result = result.filter(r => (r.reason || '').toLowerCase().includes(appliedFilters.reason.toLowerCase()));
        if (appliedFilters.status) result = result.filter(r => (r.status || '대기') === appliedFilters.status);

        if (sortConfig.key) {
          result.sort((a, b) => {
            let valA = a[sortConfig.key] || '';
            let valB = b[sortConfig.key] || '';
            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();
            if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
            if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }
        return result;
      };

      if (!currentUser) {
        return (
          <div className="login-box">
            <h2 style={{ textAlign: 'center', marginBottom: '5px', fontSize: '18px' }}>연차 및 대체휴무 관리시스템</h2>
            <p style={{ textAlign: 'center', color: '#666', fontSize: '12px', marginBottom: '20px' }}>MADE BY 삼식이(제미나이) - v2.71</p>
            {!isAdminLoginMode ? (
              <form onSubmit={handleEmployeeLogin}>
                <div className="form-group">
                  <label>직원 이름 또는 사원번호</label>
                  <input type="text" placeholder="예: 박성우 또는 사원번호 입력" value={loginName} onChange={(e) => setLoginName(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>비밀번호</label>
                  <input type="password" placeholder="비밀번호 (최초 로그인 시 신규 설정)" value={loginPw} onChange={(e) => setLoginPw(e.target.value)} required />
                </div>
                <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', padding: '8px 10px', borderRadius: '6px', fontSize: '11px', color: '#475569', marginBottom: '15px', lineHeight: '1.4' }}>
                  💡 <b>최초 로그인 가이드:</b> 원하시는 비밀번호를 입력하면 해당 비밀번호로 자동 설정되어 이후 로그인 시 사용됩니다.
                </div>
                <button className="btn" style={{ width: '100%', padding: '10px', marginBottom: '10px' }} type="submit">직원 로그인</button>
                <button type="button" className="btn btn-danger" style={{ width: '100%', padding: '10px', background: '#7f8c8d' }} onClick={() => setIsAdminLoginMode(true)}>관리자 로그인으로 전환</button>
              </form>
            ) : (
              <form onSubmit={handleAdminPinLogin}>
                <div className="form-group"><label>관리자 비밀번호</label><input type="password" placeholder="비밀번호 (기본: 1234)" value={adminPin} onChange={(e) => setAdminPin(e.target.value)} required /></div>
                <button className="btn btn-danger" style={{ width: '100%', padding: '10px', marginBottom: '10px' }} type="submit">관리자 로그인</button>
                <button type="button" className="btn" style={{ width: '100%', padding: '10px', background: '#7f8c8d' }} onClick={() => setIsAdminLoginMode(false)}>직원 로그인으로 전환</button>
              </form>
            )}
          </div>
        );
      }

      const isAdmin = currentUser.role === 'admin' || currentUser.id === 'admin';
      const displayEmployees = isAdmin ? getSortedEmployees(employees) : employees.filter(e => e.id === currentUser.id);

      return (
        <div className="app-layout">
          <div className="sidebar" style={{ width: `${sidebarWidth}px` }}>
            <div className={`sidebar-resizer ${isResizing ? 'resizing' : ''}`} onMouseDown={() => setIsResizing(true)}></div>
            <div>
              <div className="sidebar-brand"><span>📅 연차·대휴 관리 v2.71</span></div>
              <div className="sidebar-user">
                <div><b>{currentUser.title || ''} {currentUser.name}</b></div>
                <div style={{ color: '#bdc3c7', fontSize: '11px', marginTop: '3px' }}>{isAdmin ? '🛡️ 관리자 권한' : '👤 일반 직원'}</div>
              </div>
              <div className="nav-menu">
                <button className={`nav-btn ${currentTab === 'matrix' ? 'active' : ''}`} onClick={() => setCurrentTab('matrix')}>📊 월별 매트릭스</button>
                <button className={`nav-btn ${currentTab === 'request' ? 'active' : ''}`} onClick={() => setCurrentTab('request')}>📌 연차 신청</button>
                <button className={`nav-btn ${currentTab === 'comp' ? 'active' : ''}`} onClick={() => setCurrentTab('comp')}>🔄 대체휴무 신청</button>
                {isAdmin && (
                  <>
                    <button className={`nav-btn ${currentTab === 'emp' ? 'active' : ''}`} onClick={() => setCurrentTab('emp')}>👥 직원/권한/비번관리</button>
                    <button className="nav-btn" style={{ color: '#f39c12' }} onClick={() => setShowChangePinModal(true)}>🔐 관리자 비번변경</button>
                  </>
                )}
              </div>
            </div>
            <div className="sidebar-footer">
              <button className="nav-btn" style={{ background: '#e74c3c', color: '#fff', justifyContent: 'center' }} onClick={() => setCurrentUser(null)}>🚪 로그아웃</button>
            </div>
          </div>

          <div className="main-content">
            <div className="card">
              {currentTab === 'matrix' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px', flexWrap: 'wrap', gap: '10px' }}>
                    <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
                      <h3 style={{ margin: 0, fontSize: '15px' }}>📊 {selectedYear}년 {selectedMonth}월 현황</h3>
                      <select value={selectedYear} onChange={(e) => setSelectedYear(parseInt(e.target.value))}>
                        {[2024, 2025, 2026, 2027, 2028].map(y => <option key={y} value={y}>{y}년</option>)}
                      </select>
                      <select value={selectedMonth} onChange={(e) => setSelectedMonth(parseInt(e.target.value))}>
                        {Array.from({ length: 12 }, (_, i) => i + 1).map(m => <option key={m} value={m}>{m}월</option>)}
                      </select>
                    </div>
                    <button className="btn btn-excel" onClick={exportToExcel} style={{ marginBottom: 0 }}>📥 엑셀 내보내기</button>
                  </div>

                  <div className="matrix-container">
                    <table className="matrix-table">
                      <thead>
                        <tr>
                          <th style={{ width: '65px' }}>사원번호</th>
                          <th style={{ width: '85px' }}>직원명</th>
                          <th style={{ width: '80px' }}>구분</th>
                          {renderDaysHeader()}
                          <th style={{ width: '50px' }}>잔여</th>
                        </tr>
                      </thead>
                      <tbody>
                        {displayEmployees.map(emp => {
                          const fullName = `${emp.title || ''} ${emp.name}`.trim();
                          const daysData = {};
                          requests.filter(r => r.empName === fullName && r.status === "승인").forEach(r => {
                            const [y, m, d] = r.date.split('-').map(Number);
                            if (y === selectedYear && m === selectedMonth) daysData[d] = r.type;
                          });

                          const calculatedBaseLeave = emp.hireDate ? calculateAnnualLeave(emp.hireDate, selectedYear) : (emp.leaveCount || 15);
                          const totalLeave = calculatedBaseLeave + (emp.carryOver || 0) + (emp.extraLeave || 0);
                          const usedLeaveMonth = getUsedLeaveCountUntilMonth(fullName, selectedYear, selectedMonth);
                          const remainLeaveMonth = totalLeave - usedLeaveMonth;
                          const compSumMonth = getCompSummary(emp, selectedYear, selectedMonth);

                          return (
                            <React.Fragment key={emp.id}>
                              <tr>
                                <td rowSpan="2" style={{ background: '#f8fafc', fontSize: '11px' }}>{emp.empNo || '-'}</td>
                                <td rowSpan="2" style={{ fontWeight: 'bold', background: '#fafafa' }}>{fullName}</td>
                                <td style={{ background: '#e8f5e9', fontSize: '11px' }}>연차/휴무</td>
                                {Array.from({ length: 31 }, (_, i) => i + 1).map(d => {
                                  const type = daysData[d];
                                  let cellStyle = ""; let valText = "";
                                  if (type === "연차") { valText = "1"; cellStyle = "val-leave"; }
                                  else if (type === "반차") { valText = "0.5"; cellStyle = "val-leave"; }
                                  else if (type === "반반차") { valText = "0.25"; cellStyle = "val-leave"; }
                                  return <td key={d} className={cellStyle}>{valText}</td>;
                                })}
                                <td style={{ fontWeight: 'bold', color: '#27ae60' }}>{remainLeaveMonth}일</td>
                              </tr>
                              <tr>
                                <td style={{ background: '#fff9c4', fontSize: '11px' }}>대휴발생및사용</td>
                                {Array.from({ length: 31 }, (_, i) => i + 1).map(d => {
                                  const type = daysData[d];
                                  let label = ""; let cellStyle = "";
                                  if (type === "대체휴무발생") { label = "+1"; cellStyle = "val-gen"; }
                                  else if (type === "대체휴무사용") { label = "-1"; cellStyle = "val-use"; }
                                  return <td key={d} className={cellStyle}>{label}</td>;
                                })}
                                <td style={{ fontWeight: 'bold', color: '#d35400' }}>{compSumMonth.remain}일</td>
                              </tr>
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {currentTab === 'request' && (() => {
                const myFullName = `${currentUser.title || ''} ${currentUser.name}`.trim();
                const myBase = currentUser.hireDate ? calculateAnnualLeave(currentUser.hireDate, selectedYear) : (currentUser.leaveCount || 15);
                const myCarry = currentUser.carryOver || 0;
                const myExtra = currentUser.extraLeave || 0;
                const myTotal = myBase + myCarry + myExtra;
                const myUsed = getUsedLeaveCountTotal(myFullName);
                const myRemain = myTotal - myUsed;

                return (
                  <div>
                    <h3>📌 연차 신청 및 결재 내역</h3>
                    {!isAdmin && (
                      <div style={{ background: '#e8f4fd', padding: '10px 12px', borderRadius: '6px', marginBottom: '15px', fontSize: '12px', lineHeight: '1.6' }}>
                        <strong>💡 내 {selectedYear}년 연차 현황:</strong><br />
                        기본연차: <b>{myBase}일</b> | 이월: <b>{myCarry}일</b> | 추가: <b>{myExtra}일</b> | 총 연차: <b>{myTotal}일</b><br />
                        실제 사용: <b>{myUsed}일</b> | <b>잔여 연차: <span style={{ color: '#27ae60' }}>{myRemain}일</span></b>
                      </div>
                    )}

                    {/* 📱 개선된 모바일/PC 대용 연차 신청 폼 카드 */}
                    <div className="req-form-card">
                      <form onSubmit={handleAddAnnualRequest} className="req-form-grid">
                        <div className="req-form-field">
                          <label>📌 휴가 구분 선택</label>
                          <select name="type" required style={{ width: '100%' }}>
                            <option value="연차">연차 (1일 차감)</option>
                            <option value="반차">반차 (0.5일 차감)</option>
                            <option value="반반차">반반차 (0.25일 차감)</option>
                            <option value="가족돌봄휴가">가족돌봄휴가 (0일 - 차감없음)</option>
                            <option value="가족장례휴가">가족장례휴가 (0일 - 차감없음)</option>
                          </select>
                        </div>
                        <div className="req-form-field">
                          <label>📅 날짜 선택 (달력)</label>
                          <input type="date" name="date" max="9999-12-31" required style={{ width: '100%' }} />
                        </div>
                        <div className="req-form-field">
                          <label>✏️ 신청 사유</label>
                          <input type="text" name="reason" placeholder="신청 사유를 입력하세요" required style={{ width: '100%' }} />
                        </div>
                        <div>
                          <button className="btn" style={{ width: '100%', height: '38px', fontSize: '13px' }} type="submit">휴가 신청하기</button>
                        </div>
                      </form>
                    </div>

                    <h4>{isAdmin ? "전체 연차 신청 내역" : "나의 연차 신청 내역"}</h4>
                    <div className="table-responsive">
                      <table>
                        <thead>
                          <tr>
                            <th>신청자</th><th>구분</th><th>차감일수</th><th>날짜</th><th>사유</th><th>상태</th>{isAdmin && <th>결재 관리</th>}
                          </tr>
                        </thead>
                        <tbody>
                          {requests.filter(req => req.category === "연차" && (isAdmin || req.empId === currentUser.id)).map(req => (
                            <tr key={req.id}>
                              <td>{req.empName}</td>
                              <td><b>{req.type}</b></td>
                              <td>{req.usedDays}일</td>
                              <td>{req.date}</td>
                              <td>{req.reason}</td>
                              <td>
                                <span className={`badge ${req.status === '승인' ? 'bg-approved' : req.status === '반려' ? 'bg-rejected' : 'bg-pending'}`}>{req.status}</span>
                                {req.status === '반려' && req.rejectReason && <div className="reject-reason">🚨 반려사유: {req.rejectReason}</div>}
                              </td>
                              {isAdmin && (
                                <td>
                                  {req.status === '대기' && (
                                    <>
                                      <button className="btn btn-success" style={{ padding: '3px 8px', fontSize: '11px', marginRight: '5px' }} onClick={() => handleApprove(req)}>승인</button>
                                      <button className="btn btn-danger" style={{ padding: '3px 8px', fontSize: '11px' }} onClick={() => openRejectModal(req)}>반려</button>
                                    </>
                                  )}
                                </td>
                              )}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}

              {currentTab === 'comp' && (() => {
                const myCompSum = getCompSummary(currentUser);
                return (
                  <div>
                    <h3>🔄 대체휴무 발생 및 사용 신청</h3>
                    {!isAdmin && (
                      <div style={{ background: '#fff8e1', padding: '10px 12px', borderRadius: '6px', border: '1px solid #ffe082', marginBottom: '20px', fontSize: '12px', lineHeight: '1.6' }}>
                        <strong style={{ color: '#d35400' }}>💡 내 대체휴무 현황:</strong><br />
                        이월: <b>{myCompSum.compCarry}개</b> | 승인 발생: <b>{myCompSum.totalGen}개</b><br />
                        <b>총 발생: <span style={{ color: '#e67e22' }}>{myCompSum.totalGenIncludeCarry}개</span></b> | 
                        <b>총 사용: <span style={{ color: '#2980b9' }}>{myCompSum.totalUse}개</span></b> | 
                        <b>잔여: <span style={{ color: '#27ae60', fontSize: '13px' }}>{myCompSum.remain}개</span></b>
                      </div>
                    )}
                    
                    <div className="comp-form-container" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px', marginBottom: '25px' }}>
                      <div style={{ background: '#fff9c4', padding: '15px', borderRadius: '6px', border: '1px solid #fbc02d' }}>
                        <h4 style={{ margin: '0 0 10px 0', color: '#d35400', fontSize: '13px' }}>1️⃣ 대체휴무 발생 등록</h4>
                        <form onSubmit={(e) => handleAddCompRequest(e, "발생")}>
                          <div className="form-group">
                            <label>📅 근무일자 (주말/공휴일)</label>
                            <input type="date" name="date" max="9999-12-31" required />
                          </div>
                          <div className="form-group">
                            <label>✏️ 근무 사유</label>
                            <input type="text" name="reason" placeholder="예: 비상근무 등" required />
                          </div>
                          <button className="btn" style={{ background: '#e67e22', width: '100%', height: '38px' }} type="submit">대체휴무 발생 승인신청</button>
                        </form>
                      </div>

                      <div style={{ background: '#e3f2fd', padding: '15px', borderRadius: '6px', border: '1px solid #64b5f6' }}>
                        <h4 style={{ margin: '0 0 10px 0', color: '#1976d2', fontSize: '13px' }}>2️⃣ 대체휴무 사용 결재 신청</h4>
                        <form onSubmit={(e) => handleAddCompRequest(e, "사용")}>
                          <div className="form-group">
                            <label>📅 휴무 사용일자</label>
                            <input type="date" name="date" max="9999-12-31" required />
                          </div>
                          <div className="form-group">
                            <label>✏️ 사용 사유</label>
                            <input type="text" name="reason" placeholder="예: 개인 사유" required />
                          </div>
                          <button className="btn" style={{ background: '#2980b9', width: '100%', height: '38px' }} type="submit">대체휴무 사용 결재신청</button>
                        </form>
                      </div>
                    </div>

                    <h4>{isAdmin ? "전체 대체휴무 내역" : "나의 대체휴무 내역"}</h4>
                    <div className="table-responsive">
                      <table>
                        <thead>
                          <tr>
                            <th>신청자</th><th>구분</th><th>날짜</th><th>사유</th><th>상태</th>{isAdmin && <th>결재 관리</th>}
                          </tr>
                        </thead>
                        <tbody>
                          {requests.filter(req => req.category === "대체휴무" && (isAdmin || req.empId === currentUser.id)).map(req => (
                            <tr key={req.id}>
                              <td>{req.empName}</td>
                              <td style={{ fontWeight: 'bold', color: req.type === '대체휴무발생' ? '#d35400' : '#1976d2' }}>
                                {req.type === '대체휴무발생' ? '➕ 발생 (+1일)' : '➖ 사용 (-1일)'}
                              </td>
                              <td>{req.date}</td>
                              <td>{req.reason}</td>
                              <td>
                                <span className={`badge ${req.status === '승인' ? 'bg-approved' : req.status === '반려' ? 'bg-rejected' : 'bg-pending'}`}>{req.status}</span>
                                {req.status === '반려' && req.rejectReason && <div className="reject-reason">🚨 반려사유: {req.rejectReason}</div>}
                              </td>
                              {isAdmin && (
                                <td>
                                  {req.status === '대기' && (
                                    <>
                                      <button className="btn btn-success" style={{ padding: '3px 8px', fontSize: '11px', marginRight: '5px' }} onClick={() => handleApprove(req)}>승인</button>
                                      <button className="btn btn-danger" style={{ padding: '3px 8px', fontSize: '11px' }} onClick={() => openRejectModal(req)}>반려</button>
                                    </>
                                  )}
                                </td>
                              )}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}

              {currentTab === 'emp' && isAdmin && (
                <div>
                  <h3>👥 회계년도 연차 부여 및 직원 비밀번호 관리</h3>
                  <div style={{ background: '#eef2f7', padding: '15px', borderRadius: '6px', border: '1px solid #cbd5e1', marginBottom: '20px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
                      <h4 style={{ margin: 0, color: '#2c3e50' }}>📁 엑셀(.xlsx) 일괄 등록</h4>
                      <button className="btn" style={{ background: '#27ae60', fontSize: '11px', padding: '5px 12px' }} onClick={downloadExcelSample}>📄 엑셀 등록양식 다운로드</button>
                    </div>
                    <input type="file" accept=".xlsx, .xls" onChange={handleExcelImport} style={{ background: '#fff', padding: '6px 10px', border: '1px solid #ccc', borderRadius: '4px', width: '100%', marginTop: '10px' }} />
                  </div>

                  <form onSubmit={handleAddEmployee} className="emp-form-container">
                    <div className="emp-grid-row1">
                      <div className="form-group"><label>사원번호</label><input type="text" name="empNo" placeholder="사번" required /></div>
                      <div className="form-group"><label>직함</label><input type="text" name="title" placeholder="직함" required /></div>
                      <div className="form-group"><label>사원명</label><input type="text" name="empName" placeholder="성명" required /></div>
                      <div className="form-group"><label>입사일</label><input type="date" name="hireDate" value={newHireDate} onChange={handleHireDateChange} max="9999-12-31" required /></div>
                    </div>
                    <div className="emp-grid-row2">
                      <div className="form-group"><label>기본연차</label><input type="number" step="0.25" name="leaveCount" value={newLeaveCount} onChange={(e) => setNewLeaveCount(e.target.value)} required /></div>
                      <div className="form-group"><label>이월연차</label><input type="number" step="0.25" name="carryOver" defaultValue="0" /></div>
                      <div className="form-group" style={{ background: '#fff3e0', padding: '5px', borderRadius: '4px' }}><label style={{ color: '#e65100', fontWeight: 'bold' }}>이월대휴</label><input type="number" step="1" name="compCarryOver" defaultValue="0" /></div>
                      <div className="form-group"><label>추가연차</label><input type="number" step="0.25" name="extraLeave" defaultValue="0" /></div>
                      <div className="form-group"><label>비고</label><input type="text" name="remark" placeholder="비고" /></div>
                      <div className="form-group"><label>권한</label><select name="role"><option value="employee">일반직원</option><option value="admin">관리자</option></select></div>
                    </div>
                    <button className="btn btn-success" type="submit" style={{ padding: '8px 25px', width: '100%', marginTop: '10px' }}>직원 등록</button>
                  </form>

                  <div className="emp-table-container">
                    <table className="emp-table">
                      <thead>
                        <tr>
                          <th className="sortable" onClick={() => handleEmpSort('empNo')}>사원번호 {empSortConfig.key === 'empNo' ? (empSortConfig.direction === 'asc' ? '▲' : '▼') : ''}</th>
                          <th className="sortable" onClick={() => handleEmpSort('title')}>직함 {empSortConfig.key === 'title' ? (empSortConfig.direction === 'asc' ? '▲' : '▼') : ''}</th>
                          <th className="sortable" onClick={() => handleEmpSort('name')}>사원명 {empSortConfig.key === 'name' ? (empSortConfig.direction === 'asc' ? '▲' : '▼') : ''}</th>
                          <th>비밀번호</th><th>권한</th><th>입사일</th><th>기본연차</th><th>이월연차/대휴</th><th>잔여연차</th><th>잔여대휴</th><th>관리</th>
                        </tr>
                      </thead>
                      <tbody>
                        {getSortedEmployees(employees).map(e => {
                          const fullName = `${e.title || ''} ${e.name}`.trim();
                          const baseLeave = e.hireDate ? calculateAnnualLeave(e.hireDate, selectedYear) : (e.leaveCount || 15);
                          const total = baseLeave + (e.carryOver || 0) + (e.extraLeave || 0);
                          const used = getUsedLeaveCountTotal(fullName);
                          const remain = total - used;
                          const compSum = getCompSummary(e);
                          const isPwVisible = visiblePwEmpId === e.id;

                          return (
                            <tr key={e.id} className="editable-row" onDoubleClick={() => setEditingEmp(e)}>
                              <td>{e.empNo || '-'}</td>
                              <td>{e.title || '-'}</td>
                              <td>{e.name}</td>
                              <td>
                                <span style={{ fontFamily: 'monospace', fontWeight: 'bold' }}>{e.password ? (isPwVisible ? e.password : '••••••') : <i>미설정</i>}</span>
                                {e.password && <button type="button" style={{ border: 'none', background: 'none', cursor: 'pointer', marginLeft: '4px' }} onClick={(ev) => { ev.stopPropagation(); setVisiblePwEmpId(isPwVisible ? null : e.id); }}>{isPwVisible ? '🙈' : '👁️'}</button>}
                              </td>
                              <td><span className={`badge ${e.role === 'admin' ? 'bg-pending' : 'bg-approved'}`}>{e.role === 'admin' ? '관리자' : '일반'}</span></td>
                              <td>{e.hireDate || '-'}</td>
                              <td style={{ color: '#2980b9', fontWeight: 'bold' }}>{baseLeave}일</td>
                              <td style={{ fontSize: '11px' }}>연차:{e.carryOver || 0} / <b style={{ color: '#e65100' }}>대휴:{e.compCarryOver || 0}</b></td>
                              <td style={{ fontWeight: 'bold', color: '#27ae60' }}>{remain}일</td>
                              <td style={{ fontWeight: 'bold', color: '#d35400' }}>{compSum.remain}일</td>
                              <td>
                                <div style={{ display: 'flex', gap: '4px', justifyContent: 'center' }}>
                                  <button className="btn" style={{ padding: '4px 8px', fontSize: '11px', background: '#34495e' }} onClick={(ev) => { ev.stopPropagation(); setEditingEmp(e); }}>✏️ 수정</button>
                                  <button className="btn btn-danger" style={{ padding: '4px 8px', fontSize: '11px' }} onClick={(ev) => { ev.stopPropagation(); handleDeleteEmployee(e); }}>🗑️ 삭제</button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  <div style={{ marginTop: '40px', paddingTop: '20px', borderTop: '2px dashed #ccc' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                      <h3>📜 전사 통합 기록 관리</h3>
                      <button className="btn btn-success" style={{ fontSize: '11px', padding: '6px 12px' }} onClick={() => setShowAddReqModal(true)}>➕ 새로운 기록 직접 추가</button>
                    </div>

                    <form onSubmit={handleApplySearch} className="filter-box-container">
                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold' }}>신청자</label>
                        <select value={inputFilters.empName} onChange={(e) => handleInputChange('empName', e.target.value)}>
                          <option value="">전체 직원</option>
                          {employees.map(emp => { const fn = `${emp.title || ''} ${emp.name}`.trim(); return <option key={emp.id} value={fn}>{fn}</option>; })}
                        </select>
                      </div>
                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold' }}>구분</label>
                        <select value={inputFilters.category} onChange={(e) => handleInputChange('category', e.target.value)}>
                          <option value="">전체</option><option value="연차">연차</option><option value="대체휴무">대체휴무</option>
                        </select>
                      </div>
                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold' }}>유형</label>
                        <select value={inputFilters.type} onChange={(e) => handleInputChange('type', e.target.value)}>
                          <option value="">전체</option><option value="연차">연차</option><option value="반차">반차</option><option value="대체휴무발생">대체휴무발생</option><option value="대체휴무사용">대체휴무사용</option>
                        </select>
                      </div>
                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold' }}>날짜</label>
                        <input type="text" placeholder="예: 2026-10" value={inputFilters.date} onChange={(e) => handleInputChange('date', e.target.value)} />
                      </div>
                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold' }}>사유</label>
                        <input type="text" placeholder="사유" value={inputFilters.reason} onChange={(e) => handleInputChange('reason', e.target.value)} />
                      </div>
                      <div>
                        <label style={{ fontSize: '11px', fontWeight: 'bold' }}>상태</label>
                        <select value={inputFilters.status} onChange={(e) => handleInputChange('status', e.target.value)}>
                          <option value="">전체</option><option value="승인">승인</option><option value="대기">대기</option><option value="반려">반려</option>
                        </select>
                      </div>
                      <div>
                        <button type="submit" className="btn btn-success" style={{ width: '100%', padding: '6px', fontSize: '11px' }}>🔍 검색</button>
                      </div>
                    </form>

                    <div className="table-responsive">
                      <table>
                        <thead>
                          <tr>
                            <th>신청자</th><th>구분</th><th>유형</th><th>날짜</th><th>사유</th><th>상태</th><th>관리</th>
                          </tr>
                        </thead>
                        <tbody>
                          {getProcessedRequests().map(r => (
                            <tr key={r.id}>
                              <td>{r.empName}</td>
                              <td><span className="badge" style={{ background: r.category === '대체휴무' ? '#e67e22' : '#3498db' }}>{r.category || '연차'}</span></td>
                              <td>{r.type} ({r.usedDays}일)</td>
                              <td>{r.date}</td>
                              <td>{r.reason}</td>
                              <td><span className={`badge ${r.status === '승인' ? 'bg-approved' : r.status === '반려' ? 'bg-rejected' : 'bg-pending'}`}>{r.status}</span></td>
                              <td>
                                <div style={{ display: 'flex', gap: '4px', justifyContent: 'center' }}>
                                  <button className="btn" style={{ padding: '4px 8px', fontSize: '11px' }} onClick={() => setEditingReq(r)}>✏️</button>
                                  <button className="btn btn-danger" style={{ padding: '4px 8px', fontSize: '11px' }} onClick={() => handleDeleteRequest(r)}>🗑️</button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}
              
              <div className="watermark">MADE BY 삼식이(제미나이) - v2.71</div>
            </div>
          </div>

          {showAddReqModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3 style={{ color: '#27ae60' }}>➕ 새로운 기록 직접 추가</h3>
                <form onSubmit={handleAdminCreateRequest}>
                  <div className="form-group">
                    <label>신청자</label>
                    <select name="addEmpId" required>
                      <option value="">직원 선택</option>
                      {employees.map(emp => { const fn = `${emp.title || ''} ${emp.name}`.trim(); return <option key={emp.id} value={emp.id}>{fn}</option>; })}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>유형/구분</label>
                    <select name="addType" required>
                      <option value="연차">연차</option><option value="반차">반차</option><option value="반반차">반반차</option>
                      <option value="가족돌봄휴가">가족돌봄휴가</option><option value="대체휴무발생">대체휴무발생</option><option value="대체휴무사용">대체휴무사용</option>
                    </select>
                  </div>
                  <div className="form-group"><label>📅 날짜 선택</label><input type="date" name="addDate" required /></div>
                  <div className="form-group"><label>사유</label><input type="text" name="addReason" required /></div>
                  <div className="form-group">
                    <label>상태</label>
                    <select name="addStatus" defaultValue="승인" required><option value="승인">승인</option><option value="대기">대기</option><option value="반려">반려</option></select>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-success" type="submit" style={{ flex: 1 }}>등록</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1 }} onClick={() => setShowAddReqModal(false)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editingReq && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3>✏️ 기록 수정</h3>
                <form onSubmit={handleUpdateRequest}>
                  <div className="form-group"><label>신청자</label><input type="text" value={editingReq.empName} disabled style={{ background: '#f0f0f0' }} /></div>
                  <div className="form-group">
                    <label>유형</label>
                    <select name="editType" defaultValue={editingReq.type} required>
                      <option value="연차">연차</option><option value="반차">반차</option><option value="반반차">반반차</option>
                      <option value="가족돌봄휴가">가족돌봄휴가</option><option value="대체휴무발생">대체휴무발생</option><option value="대체휴무사용">대체휴무사용</option>
                    </select>
                  </div>
                  <div className="form-group"><label>📅 날짜 선택</label><input type="date" name="editDate" defaultValue={editingReq.date} required /></div>
                  <div className="form-group"><label>사유</label><input type="text" name="editReason" defaultValue={editingReq.reason} required /></div>
                  <div className="form-group">
                    <label>상태</label>
                    <select name="editStatus" defaultValue={editingReq.status} required><option value="승인">승인</option><option value="대기">대기</option><option value="반려">반려</option></select>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-success" type="submit" style={{ flex: 1 }}>수정</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1, background: '#7f8c8d' }} onClick={() => setEditingReq(null)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {rejectTarget && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3 style={{ color: '#e74c3c' }}>🚨 반려 사유 입력</h3>
                <form onSubmit={handleConfirmReject}>
                  <div className="form-group"><textarea rows="3" value={rejectReasonText} onChange={(e) => setRejectReasonText(e.target.value)} placeholder="반려 사유 입력" required /></div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-danger" type="submit" style={{ flex: 1 }}>반려 확정</button>
                    <button className="btn" type="button" style={{ flex: 1, background: '#7f8c8d' }} onClick={() => setRejectTarget(null)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editingEmp && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3>✏️ 직원 정보 및 이월대휴/비밀번호 수정</h3>
                <form onSubmit={handleUpdateEmployee}>
                  <div className="form-group"><label>사원번호</label><input type="text" name="editEmpNo" defaultValue={editingEmp.empNo || ''} required /></div>
                  <div className="form-group"><label>직함</label><input type="text" name="editTitle" defaultValue={editingEmp.title || ''} required /></div>
                  <div className="form-group"><label>사원명</label><input type="text" name="editName" defaultValue={editingEmp.name || ''} required /></div>
                  <div className="form-group" style={{ background: '#fff9c4', padding: '10px', borderRadius: '4px', border: '1px solid #fbc02d' }}>
                    <label style={{ color: '#d35400', fontWeight: 'bold' }}>🔑 비밀번호 관리</label>
                    <input type="text" name="editPassword" defaultValue={editingEmp.password || ''} placeholder="비밀번호 수정" />
                  </div>
                  <div className="form-group"><label>📅 입사일 선택</label><input type="date" name="editHireDate" defaultValue={editingEmp.hireDate || ''} required /></div>
                  <div className="form-group"><label>기본 연차 일수</label><input type="number" step="0.25" name="editLeaveCount" defaultValue={editingEmp.leaveCount || 15} required /></div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                    <div className="form-group"><label>이월 연차 일수</label><input type="number" step="0.25" name="editCarryOver" defaultValue={editingEmp.carryOver || 0} /></div>
                    <div className="form-group" style={{ background: '#fff3e0', padding: '5px', borderRadius: '4px' }}>
                      <label style={{ color: '#e65100', fontWeight: 'bold' }}>이월 대휴 일수</label>
                      <input type="number" step="1" name="compCarryOver" defaultValue={editingEmp.compCarryOver || 0} />
                    </div>
                  </div>
                  <div className="form-group"><label>추가 연차 일수</label><input type="number" step="0.25" name="editExtraLeave" defaultValue={editingEmp.extraLeave || 0} /></div>
                  <div className="form-group"><label>비고</label><input type="text" name="editRemark" defaultValue={editingEmp.remark || ''} placeholder="비고 사유" /></div>
                  <div className="form-group">
                    <label>권한 등급</label>
                    <select name="editRole" defaultValue={editingEmp.role || 'employee'}>
                      <option value="employee">일반직원</option>
                      <option value="admin">관리자</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-success" type="submit" style={{ flex: 1 }}>저장하기</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1 }} onClick={() => setEditingEmp(null)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showChangePinModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3>🔐 관리자 비밀번호 변경</h3>
                <form onSubmit={handleChangeAdminPin}>
                  <div className="form-group"><label>새 관리자 비밀번호</label><input type="password" name="newPin" required /></div>
                  <div className="form-group"><label>비밀번호 확인</label><input type="password" name="confirmPin" required /></div>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                    <button className="btn btn-success" type="submit" style={{ flex: 1 }}>변경</button>
                    <button className="btn btn-danger" type="button" style={{ flex: 1, background: '#7f8c8d' }} onClick={() => setShowChangePinModal(false)}>취소</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
